    ["d.reactor", Math.round(28+load*70+boost*2)+" %", .28+load*.7],
    ["d.fuel", fmt1(STATUS.fuel)+" %", STATUS.fuel/100],
    ["d.core", Math.round(STATUS.coreT)+" K", Math.min(1,STATUS.coreT/4200)],
    ["d.drive", Math.round(STATUS.driveT)+" K", Math.min(1,STATUS.driveT/900)],
    ["d.skin", Math.round(STATUS.skinT)+" K", Math.min(1,STATUS.skinT/700)],
    ["d.hull", Math.round(STATUS.hull)+" %", STATUS.hull/100],
    ["d.shield", Math.round(STATUS.shield)+" %", STATUS.shield/100],
    ["d.fsd", Math.round(jumpCharge*100)+" %", jumpCharge],
    ["d.range", JUMP.rangeLy.toFixed(1)+" "+T("u.ly"), 1],
    ["d.wear", fmt1(100-STATUS.wear)+" %", (100-STATUS.wear)/100],
    ["d.o2", fmt1(STATUS.o2)+" %", STATUS.o2/100],
    ["d.co2", Math.round(STATUS.co2)+" "+T("u.ppm"), Math.min(1,STATUS.co2/1200)],
    ["d.grav", (0.94+boost*.22).toFixed(2)+" g", (0.94+boost*.22)/2],
    ["d.rad", Math.round(rad)+" "+T("u.usv"), Math.min(1,rad/900)],
    ["d.star", dStar===null?"—":dStar.toFixed(2)+" "+T("u.au"), dStar===null?0:Math.min(1,dStar/30)],
    ["d.target", at?TN(+(Math.hypot(at.x,at.y,at.z)*SCALE.kmPerAU/1000).toFixed(0))+" "+T("u.kkm"):"—",
                    at?Math.min(1,Math.hypot(at.x,at.y,at.z)*4000):0],
    ["d.home", home===null?T("comms.outside"):fmt1(home)+" "+T("u.yr"),
                    home===null?0:Math.min(1,home/JUMP.sectorLy)],
    ["d.drift", TN(Math.round(STATUS.drift))+" "+T("u.km"), Math.min(1,STATUS.drift/9000)]
  ];
}

/* ==== engine/audio.js ==== */
/* ================= звук реактора =================
   Не двигатель, а плазменный контур за переборкой. Основа — гул, а не шум:
   шум ушёл в подложку, тон вышел вперёд.

   — никаких биений. Пилы, расстроенные на пару герц, дают амплитудную
     пульсацию, и ухо слышит в ней винт. Здесь синусы, расстройка ниже сотой
     герца;
   — вибрация вместо пульсации: мелкая дрожь корпуса — на семнадцати герцах
     это уже тембр, а не ритм. Медленное качание в принятых настройках
     выключено: на слух оно читалось биением;
   — эхо отсека: свёртка с процедурным импульсом, ранние отражения плюс
     затухающий хвост. Без него звук звучит «в наушниках», а не в корпусе;
   — лёгкие перемены: три медленных LFO с несоизмеримыми периодами водят
     фильтр, резонанс и расстройку. Ничего не повторяется, но и ритма нет;
   — тихо: звук должен ощущаться, а не звучать.

   Настройки — SOUND в config.js, панель по клавише K. */

const SND={ctx:null, on:true, ready:false};

/* импульс отсека: ранние отражения от переборок плюс шумовой хвост */
function makeIR(ctx,sec,decay){
  const len=Math.max(1,Math.floor(ctx.sampleRate*sec));
  const b=ctx.createBuffer(2,len,ctx.sampleRate);
  for(let ch=0;ch<2;ch++){
    const d=b.getChannelData(ch);
    for(let i=0;i<len;i++){
      const t=i/len;
      d[i]=(Math.random()*2-1)*Math.pow(1-t,decay)*.6;
    }
    [[.009,.7],[.017,-.5],[.028,.42],[.041,-.3],[.063,.22]].forEach(([tt,a],k)=>{
      const idx=Math.floor(tt*(1+ch*.13)*ctx.sampleRate);
      if(idx<len) d[idx]+=a;
    });
  }
  return b;
}

function audioBuild(ctx,dest){
  const S={};
  const out=ctx.createGain();
  out.gain.value=0.0001;
  S.out=out;

  /* эхо отсека: часть сигнала уходит в свёртку */
  const conv=ctx.createConvolver();
  conv.buffer=makeIR(ctx,SOUND.echoSec,SOUND.echoDecay);
  const send=ctx.createGain(); send.gain.value=SOUND.echo;
  const wet=ctx.createGain(); wet.gain.value=1;
  out.connect(dest||ctx.destination);
  out.connect(send); send.connect(conv); conv.connect(wet);
  wet.connect(dest||ctx.destination);
  S.conv=conv; S.send=send;

  /* --- контур: тон, гармоника, полуторная и подтон, все синусом --- */
  const mk=(hz,g)=>{
    const o=ctx.createOscillator(); o.type="sine"; o.frequency.value=hz;
    const gn=ctx.createGain(); gn.gain.value=g;
    o.connect(gn); gn.connect(out); o.start();
    return [o,gn];
  };
  [S.core,S.coreG]=mk(SOUND.coreHz, SOUND.core);
  [S.harm,S.harmG]=mk(SOUND.coreHz*2.004, SOUND.harm);
  [S.fifth,S.fifthG]=mk(SOUND.coreHz*1.5017, SOUND.fifth);
  [S.sub,S.subG]=mk(SOUND.coreHz*.5, SOUND.sub);

  /* --- шум плазмы: розовый, приглушённый обшивкой --- */
  const len=ctx.sampleRate*3, buf=ctx.createBuffer(1,len,ctx.sampleRate);
  const d=buf.getChannelData(0);
  let b0=0,b1=0,b2=0;
  for(let i=0;i<len;i++){
    const w=Math.random()*2-1;
    b0=.997*b0+w*.0555; b1=.985*b1+w*.0750; b2=.950*b2+w*.1538;
    d[i]=(b0+b1+b2+w*.02)*.35;
  }
  const noise=ctx.createBufferSource();
  noise.buffer=buf; noise.loop=true;

  const skin=ctx.createBiquadFilter();
  skin.type="lowpass"; skin.frequency.value=SOUND.cutoff; skin.Q.value=.5;
  const noiseG=ctx.createGain(); noiseG.gain.value=SOUND.noise;
  noise.connect(skin); skin.connect(noiseG); noiseG.connect(out);

  const body=ctx.createBiquadFilter();
  body.type="bandpass"; body.frequency.value=SOUND.bodyHz; body.Q.value=3.2;
  const bodyG=ctx.createGain(); bodyG.gain.value=SOUND.body;
  noise.connect(body); body.connect(bodyG); bodyG.connect(out);

  const hiss=ctx.createBiquadFilter();
  hiss.type="highpass"; hiss.frequency.value=4200; hiss.Q.value=.7;
  const hissG=ctx.createGain(); hissG.gain.value=SOUND.hiss;
  noise.connect(hiss); hiss.connect(hissG); hissG.connect(out);
  noise.start();
  S.skin=skin; S.noiseG=noiseG; S.body=body; S.bodyG=bodyG; S.hissG=hissG;

  /* --- вибрация корпуса: качание и мелкая дрожь, обе на общий уровень --- */
  const lfo=(hz,depth,target)=>{
    const o=ctx.createOscillator(); o.type="sine"; o.frequency.value=hz;
    const g=ctx.createGain(); g.gain.value=depth;
    o.connect(g); g.connect(target); o.start();
    return [o,g];
  };
  [S.vib,S.vibG]=lfo(SOUND.vibHz, SOUND.vib*SOUND.master, out.gain);
  [S.shake,S.shakeG]=lfo(SOUND.shakeHz, SOUND.shake*SOUND.master, out.gain);

  /* --- лёгкие перемены: три медленных водителя, периоды несоизмеримы --- */
  [S.slowA,S.slowAG]=lfo(SOUND.slowA, SOUND.cutoff*.30, skin.frequency);
  [S.slowB,S.slowBG]=lfo(SOUND.slowB, SOUND.bodyHz*.22, body.frequency);
  [S.slowC,S.slowCG]=lfo(SOUND.slowC, SOUND.coreHz*.012, S.core.frequency);
  return S;
}

function audioStart(){
  if(SND.ctx||!SND.on) return;
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC) return;
  const ctx=new AC();
  SND.ctx=ctx;
  const g=audioBuild(ctx);
  for(const k in g) SND[k]=g[k];
  SND.ready=true;
  audioLevel(SOUND.master*.5);
}

/* применить настройки целиком — панель зовёт это на каждое движение ползунка */
function audioApply(rebuildIR){
  if(!SND.ready) return;
  const t=SND.ctx.currentTime, set=(p,v)=>p.setTargetAtTime(v,t,.05);
  set(SND.coreG.gain,SOUND.core); set(SND.harmG.gain,SOUND.harm);
  set(SND.fifthG.gain,SOUND.fifth); set(SND.subG.gain,SOUND.sub);
  set(SND.noiseG.gain,SOUND.noise); set(SND.bodyG.gain,SOUND.body);
  set(SND.hissG.gain,SOUND.hiss);
  set(SND.core.frequency,SOUND.coreHz); set(SND.harm.frequency,SOUND.coreHz*2.004);
  set(SND.fifth.frequency,SOUND.coreHz*1.5017); set(SND.sub.frequency,SOUND.coreHz*.5);
  set(SND.skin.frequency,SOUND.cutoff); set(SND.body.frequency,SOUND.bodyHz);
  set(SND.vib.frequency,SOUND.vibHz); set(SND.vibG.gain,SOUND.vib*SOUND.master);
  set(SND.shake.frequency,SOUND.shakeHz); set(SND.shakeG.gain,SOUND.shake*SOUND.master);
  set(SND.slowA.frequency,SOUND.slowA); set(SND.slowB.frequency,SOUND.slowB);
  set(SND.slowC.frequency,SOUND.slowC);
  set(SND.send.gain,SOUND.echo);
  if(rebuildIR) SND.conv.buffer=makeIR(SND.ctx,SOUND.echoSec,SOUND.echoDecay);
}

/* один вызов на кадр: тяга поднимает контур, форсаж приоткрывает переборку */
function audioUpdate(load,boost,jump){
  if(!SND.ready||!SND.on) return;
  const t=SND.ctx.currentTime, k=.35;
  const set=(p,v)=>p.setTargetAtTime(v,t,k);
  const drive=load*.75+boost*.25;
  set(SND.out.gain, SOUND.master*(.42+.58*drive)+jump*SOUND.master*1.1);
  set(SND.core.frequency, SOUND.coreHz*(1+drive*.34+jump*.5));
  set(SND.harm.frequency, SOUND.coreHz*2.004*(1+drive*.34+jump*.5));
  set(SND.fifth.frequency, SOUND.coreHz*1.5017*(1+drive*.34+jump*.5));
  set(SND.sub.frequency, SOUND.coreHz*.5*(1+drive*.22));
  set(SND.subG.gain, SOUND.sub*(1+boost*.8));
  set(SND.skin.frequency, SOUND.cutoff*(1+drive*1.5+jump*4.5));
  set(SND.noiseG.gain, SOUND.noise*(.6+drive*.9+jump*1.6));
  set(SND.bodyG.gain, SOUND.body*(.7+drive*.8));
  set(SND.hissG.gain, SOUND.hiss*(.5+drive*1.4+jump*3));
  set(SND.vibG.gain, SOUND.vib*SOUND.master*(.6+drive*1.2+jump*2));
}

function audioLevel(v){
  if(SND.ready) SND.out.gain.setTargetAtTime(v,SND.ctx.currentTime,.3);
}

/* Шумоподавление: гасит контур, оставляя тишину в гарнитуре. Названо так,
   как это называется на борту, — глушится ведь не звук вообще, а фон
   реактора, который слышно через переборку. */
function noiseCancel(){
  SND.on=!SND.on;
  if(!SND.on) audioLevel(0.0001);
  else if(!SND.ctx) audioStart();
  else audioLevel(SOUND.master*.5);
  return !SND.on;                      // true — подавление включено
}

/* ==== engine/comms.js ==== */
/* ================= связь =================
   Проверка канала звучит так, как звучит настоящая дуплексная гарнитура:
   щелчок тангенты, шип открытого эфира, живой человек прокашливается, речь,
   и на отпускании — второй щелчок с коротким хвостом шума.

   Обе реплики синтезированы офлайн (piper) и обработаны под полосу рации.
   Наш голос — ryan, понижен на три с половиной полутона и расширен книзу до
   двухсот герц: так он звучит басовитее и глубже. Ответ станции — русская
   модель dmitri, читающая английский текст: фонемизация идёт по-русски, и
   акцент получается сам собой, без подделки. Его канал уже и тише — сигнал
   приходит издалека, и это слышно по звуку, а не по надписи.

   Кашель и щелчки не записаны, а собраны здесь: короткий шумовой всплеск с
   резкой атакой — это и есть щелчок реле, а два всплеска пониже с полосой
   около 700 Гц слышатся как покашливание. */

const COMMS={busy:false, buf:{}, loading:{}};

/* Каналы не заданы здесь: движок спрашивает каталог объектов, какие станции
   уместны в этой системе. Про МИР он не знает — знает только то, что
   объекты вида "station" умеют разговаривать. */
function commsChannels(){
  return (typeof objectsHere==="function" ? objectsHere("station") : [])
    .filter(o=>o.comms);
}

function commsNoiseBuf(ctx,sec){
  const len=Math.floor(ctx.sampleRate*sec), b=ctx.createBuffer(1,len,ctx.sampleRate);
  const d=b.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
  return b;
}

/* Щелчок тангенты: миллисекунды шума с резким спадом плюс призвук реле.
   Верх срезан вдвое ниже прежнего — щелчок должен быть глухим стуком в
   наушнике, а не цоканьем; громкость тоже вдвое меньше. */
function commsClick(at,up){
  const ctx=SND.ctx; if(!ctx) return;
  const src=ctx.createBufferSource(); src.buffer=commsNoiseBuf(ctx,.06);
  const hp=ctx.createBiquadFilter(); hp.type="highpass"; hp.frequency.value=up?800:620;
  const lp=ctx.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=2200; lp.Q.value=.8;
  const g=ctx.createGain();
  g.gain.setValueAtTime(up?.08:.11,at);
  g.gain.exponentialRampToValueAtTime(.0001,at+(up?.038:.052));   // спад длиннее — гулче
  src.connect(hp); hp.connect(lp); lp.connect(g); g.connect(ctx.destination);
  src.start(at); src.stop(at+.08);

  const o=ctx.createOscillator(); o.type="square"; o.frequency.value=up?1500:1050;
  const og=ctx.createGain();
  og.gain.setValueAtTime(.025,at);
  og.gain.exponentialRampToValueAtTime(.0001,at+.016);
  o.connect(og); og.connect(ctx.destination);
  o.start(at); o.stop(at+.024);
}

/* Открытый эфир: шум, живущий, пока канал открыт. Полоса опущена с полутора
   килогерц до семисот и сужена — вместо шипения выходит гул в наушнике; над
   ней ещё один срез, чтобы верх не пролезал. Громкость вдвое меньше прежней. */
function commsHiss(at,dur){
  const ctx=SND.ctx; if(!ctx) return;
  const src=ctx.createBufferSource(); src.buffer=commsNoiseBuf(ctx,Math.max(1,dur+1));
  const bp=ctx.createBiquadFilter(); bp.type="bandpass";
  bp.frequency.value=720; bp.Q.value=.38;
  const lp=ctx.createBiquadFilter(); lp.type="lowpass";
  lp.frequency.value=1600; lp.Q.value=.7;
  const g=ctx.createGain();
  g.gain.setValueAtTime(.0001,at);
  g.gain.linearRampToValueAtTime(.015,at+.04);
  g.gain.setValueAtTime(.015,at+dur);
  g.gain.linearRampToValueAtTime(.0001,at+dur+.26);   // хвост после отпускания
  src.connect(bp); bp.connect(lp); lp.connect(g); g.connect(ctx.destination);
  src.start(at); src.stop(at+dur+.45);
}

/* покашливание: два всплеска, второй короче и тише */
function commsCough(at){
  const ctx=SND.ctx; if(!ctx) return;
  [[0,.20,700,.16],[.30,.14,620,.11]].forEach(([off,dur,hz,amp])=>{
    const t=at+off;
    const src=ctx.createBufferSource(); src.buffer=commsNoiseBuf(ctx,dur+.1);
    const bp=ctx.createBiquadFilter(); bp.type="bandpass";
    bp.frequency.value=hz; bp.Q.value=1.4;
    const lp=ctx.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=2600;
    const g=ctx.createGain();
    g.gain.setValueAtTime(.0001,t);
    g.gain.linearRampToValueAtTime(amp,t+.012);        // резкая атака
    g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    src.connect(bp); bp.connect(lp); lp.connect(g); g.connect(ctx.destination);
    src.start(t); src.stop(t+dur+.05);
    // низкая составляющая: грудь, а не только горло
    const o=ctx.createOscillator(); o.type="triangle"; o.frequency.value=118;
    const og=ctx.createGain();
    og.gain.setValueAtTime(.0001,t);
    og.gain.linearRampToValueAtTime(amp*.5,t+.015);
    og.gain.exponentialRampToValueAtTime(.0001,t+dur*.8);
    o.connect(og); og.connect(ctx.destination);
    o.start(t); o.stop(t+dur);
  });
}

function commsDecode(key,cb){
  if(COMMS.buf[key]) return cb(COMMS.buf[key]);
  if(COMMS.loading[key]||typeof EARTH_MAPS==="undefined"||!EARTH_MAPS[key]) return;
  COMMS.loading[key]=true;
  fetch(EARTH_MAPS[key]).then(r=>r.arrayBuffer()).then(a=>
    SND.ctx.decodeAudioData(a,b=>{ COMMS.buf[key]=b; COMMS.loading[key]=false; cb(b); },
      ()=>{ COMMS.loading[key]=false; })
  ).catch(()=>{ COMMS.loading[key]=false; });
}

/* проиграть готовую запись через полосу гарнитуры */
function commsSay(buf,at,gain,hz,q){
  const ctx=SND.ctx;
  const src=ctx.createBufferSource(); src.buffer=buf;
  const bp=ctx.createBiquadFilter(); bp.type="bandpass";
  bp.frequency.value=hz; bp.Q.value=q;
  const g=ctx.createGain(); g.gain.value=gain;
  src.connect(bp); bp.connect(g); g.connect(ctx.destination);
  src.start(at);
  return buf.duration;
}

/* Весь обмен одной командой: наш запрос и ответ станции. Ответ идёт через
   более узкую полосу и тише — он приходит издалека, и слышно это по звуку,
   а не по надписи. */
function commsCheck(){
  if(!SND.ctx) audioStart();
  if(!SND.ctx||COMMS.busy) return false;
  const ctx=SND.ctx;
  COMMS.busy=true;
  const ch=commsChannels()[0];
  commsDecode("voice",buf=>{
    const t0=ctx.currentTime+.05;
    const ours=buf.duration+1.05;
    commsClick(t0,true);
    commsHiss(t0+.02,ours);
    commsCough(t0+.22);
    commsSay(buf,t0+.95,.62,1100,.32);           // наш голос: ниже и тише
    commsClick(t0+ours,false);

    commsDecode(ch?ch.comms.voice:"mir",mir=>{
      const t1=t0+ours+.85;                      // пауза: станция отвечает не сразу
      const theirs=mir.duration+.35;
      commsClick(t1,true);
      commsHiss(t1+.02,theirs);
      commsSay(mir,t1+.22,.52,1350,.55);         // канал дальний: полоса уже
      commsClick(t1+theirs,false);
      setTimeout(()=>{ COMMS.busy=false; },(ours+theirs+1.6)*1000);
    });
  });
  return true;
}

/* ==== engine/render.js ==== */
/* ================= рендер ================= */
function resize(){
  dpr=Math.min(window.devicePixelRatio||1,2);
  W=cv.clientWidth; H=cv.clientHeight;
  cv.width=W*dpr; cv.height=H*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  cx=W/2; cy=H/2; F=Math.max(W,H)*.78;
}
window.addEventListener("resize",resize);

const R={cy:1,sy:0,cp:1,sp:0};      // синусы кадра — один раз, не на каждую точку
function setRot(dy,dp){ R.cy=Math.cos(dy); R.sy=Math.sin(dy); R.cp=Math.cos(dp); R.sp=Math.sin(dp); }
function rotate(p){
  const x=p.x*R.cy - p.z*R.sy;
  let z=p.x*R.sy + p.z*R.cy;
  const y=p.y*R.cp - z*R.sp;
  z=p.y*R.sp + z*R.cp;
  p.x=x; p.y=y; p.z=z;
}

function drawSky(list,mode){
  ctx.globalCompositeOperation=mode;
  for(let i=0;i<list.length;i++){
    const p=list[i];
    rotate(p);
    if(p.z<300) continue;
    const k=F/p.z, sx=cx+p.x*k, sy=cy+p.y*k, rw=p.s*k, rh=rw*p.e;
    if(sx<-rw*2||sx>W+rw*2||sy<-rh*2||sy>H+rh*2) continue;
    ctx.save();
    ctx.translate(sx,sy); ctx.rotate(p.rot);
    ctx.globalAlpha=p.a;
    ctx.drawImage(p.sp,-rw,-rh,rw*2,rh*2);
    ctx.restore();
  }
  ctx.globalAlpha=1;
  ctx.globalCompositeOperation="source-over";
}


let last=performance.now();
function frame(now){
  let dt=(now-last)/1000; last=now;
  if(dt>.05) dt=.05;
  S.t+=dt;

  /* --- прыжок --- */
  let jumpK=0;                       // 0 — обычный полёт, 1 — разгар тоннеля
  if(J.ph){
    J.t+=dt;
    if(J.ph===1){
      jumpK=.22*(J.t/J_CHARGE);
      if(J.t>=J_CHARGE){ J.ph=2; J.t=0; }
    }else if(J.ph===2){
      const q=J.t/J_TUNNEL;
      jumpK=.22+q*q*.78;
      J.flash=Math.pow(q,3.2);
      if(J.t>=J_TUNNEL){ J.ph=3; J.t=0; J.flash=1; arrive(); }
    }else{
      jumpK=Math.max(0,1-J.t/(J_EXIT*.7));
      J.flash=Math.max(0,1-J.t/(J_EXIT*.55));
      if(J.t>=J_EXIT){ J.ph=0; J.flash=0; }
    }
  }

  /* --- управление --- */
  const lock=J.ph===2?0:1;           // в тоннеле курс не слушается
  const tgtYaw=(K.l-K.r)*0.62*lock, tgtPitch=(K.d-K.u)*0.48*lock;
  S.vyaw += (tgtYaw-S.vyaw)*Math.min(1,dt*2.2);
  S.vpitch += (tgtPitch-S.vpitch)*Math.min(1,dt*2.2);
  const dyaw=S.vyaw*dt, dpitch=S.vpitch*dt;
  S.yaw+=dyaw; S.pitch+=dpitch;
  S.vroll += ((-S.vyaw*.30)-S.vroll)*Math.min(1,dt*1.6);
  S.roll=S.vroll;

  const bt=S.boostKey?1:0;
  S.boost += (bt-S.boost)*Math.min(1,dt*(bt?1.1:.6));
  const target=S.throttle*MAXV*(1+S.boost*3.4) + jumpK*jumpK*MAXV*26;
  S.speed += (target-S.speed)*Math.min(1,dt*(J.ph===3?2.6:1.35));
  const travel=S.speed*dt;
  const streak=STREAK+jumpK*7;       // в тоннеле пыль вытягивается в нити

  /* --- фон --- */
  ctx.fillStyle="#00010a"; ctx.fillRect(0,0,W,H);
  setRot(-dyaw,-dpitch);

  ctx.save();
  ctx.translate(cx,cy); ctx.rotate(S.roll); ctx.translate(-cx,-cy);
  drawSky(gas,"lighter");
  drawSky(dust,"source-over");

  /* --- звёздная крупа --- */
  ctx.globalCompositeOperation="lighter";
  ctx.fillStyle="#eef3ff";
  for(let g=0;g<GRIT_BANDS;g++){
    const band=grit[g], n=band.length;
    ctx.globalAlpha=(.16+((g+.5)/GRIT_BANDS)*.62)*(1-jumpK*.6);
    ctx.beginPath();
    for(let i=0;i<n;i++){
      const p=band[i];
      rotate(p);
      if(p.z<=1) continue;
      const k=F/p.z, sx=cx+p.x*k, sy=cy+p.y*k;
      if(sx<0||sx>W||sy<0||sy>H) continue;
      ctx.rect(sx,sy,1,1);
    }
    ctx.fill();
  }
  ctx.globalAlpha=1;

  /* --- звёзды --- */
  for(let i=0;i<FAR;i++){
    const p=far[i];
    rotate(p);
    if(p.z<=1) continue;
    const k=F/p.z, sx=cx+p.x*k, sy=cy+p.y*k;
    if(sx<-40||sx>W+40||sy<-40||sy>H+40) continue;
    const tw=.80+.20*Math.sin(S.t*p.ts+p.t);
    const a=p.b*tw;
    if(a<.03) continue;
    if(jumpK>.12){                   // в тоннеле звёзды растягиваются от центра
      const st=1+jumpK*jumpK*7;
      ctx.globalAlpha=a*.9;
      ctx.strokeStyle="#cfe0ff"; ctx.lineWidth=.9+p.b*1.1; ctx.lineCap="round";
      ctx.beginPath();
      ctx.moveTo(cx+(sx-cx)/st,cy+(sy-cy)/st); ctx.lineTo(sx,sy); ctx.stroke();
      continue;
    }
    // размер растёт быстрее яркости: слабые остаются крупинками,
    // а не уменьшенными копиями ярких
    const d=1.0+p.b*p.b*4.4;
    ctx.globalAlpha=a;
    ctx.drawImage(p.sp,sx-d,sy-d,d*2,d*2);
    if(p.big){                        // ярким — только второй, широкий ореол
      const r=d*2.6;
      ctx.globalAlpha=a*.34;
      ctx.drawImage(p.sp,sx-r,sy-r,r*2,r*2);
    }
  }
  ctx.globalAlpha=1;
  rotateSystem();
  if(jumpK<.5){ drawSun(); drawPlanet(); }

  /* --- ближняя пыль: стрики --- */
  const fast=Math.min(1,S.speed/MAXV);
  for(let i=0;i<NEAR;i++){
    const p=near[i];
    rotate(p);
    p.z-=travel;
    if(p.z<1.2){ seedNear(p,false); continue; }
    if(p.z>DEPTH+40){ seedNear(p,false); continue; }
    const k=F/p.z;
    const sx=cx+p.x*k, sy=cy+p.y*k;
    if(sx<-160||sx>W+160||sy<-160||sy>H+160){
      if(p.z<DEPTH*.35) seedNear(p,false);
      continue;
    }
    const z0=p.z+travel*streak*(1+S.boost*.5), k0=F/z0;
    const px=cx+p.x*k0, py=cy+p.y*k0;
    let a=p.b*Math.min(1,(DEPTH-p.z)/(DEPTH*.42))*Math.min(1,p.z/7);
    a*=.46+Math.min(1,fast)*.54;
    if(a<=.01) continue;
    const col=jumpK>.2?"186,214,255":(p.w===1?"255,212,164":p.w===2?"158,198,255":"228,240,255");
    const len=Math.hypot(sx-px,sy-py);
    if(len>1.4){
      ctx.strokeStyle="rgba("+col+","+(a*(.40+jumpK*.45)).toFixed(3)+")";
      ctx.lineWidth=Math.min(1.45,.34+k*.026)*(1+jumpK*.7);
      ctx.lineCap="round";
      ctx.beginPath(); ctx.moveTo(px,py); ctx.lineTo(sx,sy); ctx.stroke();
    }
    ctx.fillStyle="rgba("+col+","+a.toFixed(3)+")";
    ctx.beginPath(); ctx.arc(sx,sy,Math.min(1.6,.40+k*.028),0,6.2832); ctx.fill();
  }
  ctx.globalCompositeOperation="source-over";
  ctx.restore();

  /* --- пост: тоннель скорости, вспышка перехода, виньетка --- */
  const glow=Math.min(1,fast)*(1+S.boost)+jumpK*2.2;
  if(glow>.04){
    const gr=ctx.createRadialGradient(cx,cy,Math.min(W,H)*.16,cx,cy,Math.max(W,H)*.75);
    gr.addColorStop(0,"rgba(120,180,255,0)");
    gr.addColorStop(.62,"rgba(90,150,255,"+(glow*.05).toFixed(3)+")");
    gr.addColorStop(1,"rgba(150,190,255,"+Math.min(.85,glow*.13).toFixed(3)+")");
    ctx.globalCompositeOperation="lighter";
    ctx.fillStyle=gr; ctx.fillRect(0,0,W,H);
    ctx.globalCompositeOperation="source-over";
  }
  if(J.flash>.002){
    ctx.fillStyle="rgba(226,239,255,"+Math.min(1,J.flash).toFixed(3)+")";
    ctx.fillRect(0,0,W,H);
  }
  const vg=ctx.createRadialGradient(cx,cy,Math.min(W,H)*.28,cx,cy,Math.max(W,H)*.78);
  vg.addColorStop(0,"rgba(0,0,0,0)"); vg.addColorStop(1,"rgba(0,0,2,.72)");
  ctx.fillStyle=vg; ctx.fillRect(0,0,W,H);

  /* --- HUD --- */
  if(typeof drawSysMap==="function") drawSysMap();
  if(typeof shipUpdate==="function") shipUpdate(dt,fast,S.boost,jumpK);
  if(typeof dockUpdate==="function") dockUpdate(dt);
  if(typeof audioUpdate==="function") audioUpdate(fast,S.boost,jumpK);
  spdEl.textContent=Math.round(S.speed*38).toLocaleString("ru-RU");
  fsdEl.classList.toggle("on",S.boost>.25||J.ph>0);
  fsdEl.textContent=J.ph?(J.ph===1?T("hud.charging"):J.ph===2?T("hud.witch"):T("hud.arrival")):T("hud.fsd");

  requestAnimationFrame(frame);
}

/* ================= ввод ================= */
const spdEl=document.getElementById("spd"), fsdEl=document.getElementById("fsd"),
      tfill=document.getElementById("tfill"), tval=document.getElementById("tval"),
      hud=document.getElementById("hud"), help=document.getElementById("help"),
      boot=document.getElementById("boot"), sysEl=document.getElementById("sys");

function setThrottle(v){
  S.throttle=Math.max(0,Math.min(1,v));
  tfill.style.height=(S.throttle*100)+"%";
  tval.textContent=Math.round(S.throttle*100)+"%";
}
window.addEventListener("pointermove",()=>wake(),{passive:true});   // мышь курс не ведёт — только будит интерфейс
window.addEventListener("wheel",e=>{
  setThrottle(S.throttle-Math.sign(e.deltaY)*.05); wake();
},{passive:true});
window.addEventListener("keydown",e=>{
  const k=e.key.toLowerCase();
  /* опции перехватывают управление первыми: это окно самое верхнее */
  if(optOpen){
    if(e.key==="ArrowUp"){optMove(-1);e.preventDefault();return}
    if(e.key==="ArrowDown"){optMove(1);e.preventDefault();return}
    if(e.key==="Enter"){optConfirm();e.preventDefault();return}
    if(e.key==="Escape"||k==="o"||k==="щ"){toggleOptions();e.preventDefault();return}
    return;
  }
  /* пока открыто меню прыжка, стрелки выбирают цель, а не ведут курс */
  if(jumpOpen){
    if(e.key==="ArrowUp"){jumpMove(-1);e.preventDefault();return}
    if(e.key==="ArrowDown"){jumpMove(1);e.preventDefault();return}
    if(e.key==="Enter"){jumpConfirm();e.preventDefault();return}
    if(e.key==="Escape"||k==="j"||k==="о"){toggleJumpMenu();e.preventDefault();return}
    return;
  }
  wake();
  if(e.key==="ArrowLeft"){K.l=1;e.preventDefault()}
  else if(e.key==="ArrowRight"){K.r=1;e.preventDefault()}
  else if(e.key==="ArrowUp"){K.u=1;e.preventDefault()}
  else if(e.key==="ArrowDown"){K.d=1;e.preventDefault()}
  else if(k==="w"||k==="ц"){setThrottle(S.throttle+.06);e.preventDefault()}
  else if(k==="s"||k==="ы"){setThrottle(S.throttle-.06);e.preventDefault()}
  else if(e.code==="Space"){S.boostKey=true;e.preventDefault()}
  else if(k==="j"||k==="о"){toggleJumpMenu();e.preventDefault()}
  else if(k==="f"||k==="а"){toggleFS()}
  else if(k==="h"||k==="р"){hud.classList.toggle("off")}
  else if(k==="x"||k==="ч"){setThrottle(0)}
  else if(k==="m"||k==="ь"){noiseCancel()}
  else if(k==="k"||k==="л"){toggleSoundPanel()}
  else if(k==="o"||k==="щ"){toggleOptions()}
  else if(k==="i"||k==="ш"){toggleSysInfo()}
  else if(e.key==="Escape"&&infoOpen){toggleSysInfo()}
});
window.addEventListener("keyup",e=>{
  if(e.code==="Space") S.boostKey=false;
  else if(e.key==="ArrowLeft") K.l=0;
  else if(e.key==="ArrowRight") K.r=0;
  else if(e.key==="ArrowUp") K.u=0;
  else if(e.key==="ArrowDown") K.d=0;
});
window.addEventListener("blur",()=>{K.l=K.r=K.u=K.d=0;S.boostKey=false;});

  if(!document.fullscreenElement) (document.documentElement.requestFullscreen||function(){}).call(document.documentElement);
  else document.exitFullscreen();

/* ==== ui/sysmap.js ==== */
/* ================= карта системы =================
   Радар рисуется из тех же векторов «объект минус корабль», по которым
   строится кадр. Поэтому направление на планету на карте и в небе совпадает
   по определению: разойтись им негде.

   Расстояние сжато логарифмом. Без этого планета прилёта, до которой
   единицы, слипалась бы с отметкой корабля, пока дальние орбиты занимают
   всю карту — направление важнее точной дистанции. */

const mapCv=document.getElementById("sysmap");
const mapCtx=mapCv?mapCv.getContext("2d"):null;
const MAP_TILT=.42;              // наклон плоскости системы на карте

/* Нос корабля на карте смотрит вверх, поэтому «вперёд» (z>0) обязано уходить
   вверх, а не вниз, и объект ниже нас — вниз. У экрана ось y направлена вниз,
   отсюда знаки: перепутанные, карта читается вверх ногами. */
function mapProject(x,y,z,k){     // 3D → экран радара
  return [x*k, y*k*.52 - z*k*MAP_TILT];
}

function mapPoint(o,R,dmax){
  const d=Math.hypot(o.x,o.y,o.z)||1e-6;
  const s=Math.log(1+d/2)/Math.log(1+dmax/2);      // сжатие по дальности
  return mapProject(o.x,o.y,o.z,(R*Math.min(1,s))/d);
}

function drawSysMap(){
  if(!mapCtx) return;
  const w=mapCv.width, h=mapCv.height, ox=w/2, oy=h*.54, R=Math.min(w,h)*.40;
  mapCtx.clearRect(0,0,w,h);

  /* плоскость: два эллипса и перекрестье */
  mapCtx.strokeStyle="rgba(255,157,47,.16)"; mapCtx.lineWidth=1;
  for(const q of [1,.55]){
    mapCtx.beginPath();
    mapCtx.ellipse(ox,oy,R*q,R*q*MAP_TILT,0,0,6.2832);
    mapCtx.stroke();
  }
  mapCtx.beginPath();
  mapCtx.moveTo(ox-R,oy); mapCtx.lineTo(ox+R,oy);
  mapCtx.moveTo(ox,oy-R*MAP_TILT); mapCtx.lineTo(ox,oy+R*MAP_TILT);
  mapCtx.stroke();

  /* корабль: нос смотрит вверх карты, то есть по курсу */
  mapCtx.fillStyle="rgba(255,157,47,.95)";
  mapCtx.beginPath();
  mapCtx.moveTo(ox,oy-5); mapCtx.lineTo(ox+3.6,oy+3.4); mapCtx.lineTo(ox-3.6,oy+3.4);
  mapCtx.closePath(); mapCtx.fill();

  if(!sun){
    mapCtx.fillStyle="rgba(255,157,47,.42)";
    mapCtx.font="9px ui-monospace,monospace"; mapCtx.textAlign="center";
    mapCtx.fillText(T("map.noStar"),ox,h-6);
    return;
  }

  /* самый дальний объект задаёт масштаб карты */
  let dmax=Math.hypot(sun.x,sun.y,sun.z);
  if(planets) for(const p of planets.list){
    const d=Math.hypot(p.x,p.y,p.z);
    if(d>dmax) dmax=d;
  }

  const stalk=(px,py,o,k)=>{                        // стойка до плоскости
    const fl=mapProject(o.x,0,o.z,k);
    mapCtx.strokeStyle="rgba(255,157,47,.20)";
    mapCtx.beginPath(); mapCtx.moveTo(px,py); mapCtx.lineTo(ox+fl[0],oy+fl[1]); mapCtx.stroke();
  };

  /* звезда */
  const sd=Math.hypot(sun.x,sun.y,sun.z)||1e-6;
  const sk=(R*Math.min(1,Math.log(1+sd/2)/Math.log(1+dmax/2)))/sd;
  const sp=mapPoint(sun,R,dmax), sx=ox+sp[0], sy=oy+sp[1];
  stalk(sx,sy,sun,sk);
  mapCtx.fillStyle="rgba("+sun.t.col+",.95)";
  mapCtx.beginPath(); mapCtx.arc(sx,sy,4,0,6.2832); mapCtx.fill();

  /* планеты */
  if(planets) for(const p of planets.list){
    const d=Math.hypot(p.x,p.y,p.z)||1e-6;
    const k=(R*Math.min(1,Math.log(1+d/2)/Math.log(1+dmax/2)))/d;
    const pt=mapPoint(p,R,dmax), px=ox+pt[0], py=oy+pt[1];
    stalk(px,py,p,k);
    if(p.arrival){
      mapCtx.strokeStyle="rgba(159,212,255,.9)"; mapCtx.lineWidth=1;
      mapCtx.beginPath(); mapCtx.arc(px,py,5,0,6.2832); mapCtx.stroke();
      mapCtx.fillStyle="rgba(159,212,255,.95)";
    }else{
      mapCtx.fillStyle="rgba(255,213,160,.72)";
    }
    mapCtx.beginPath(); mapCtx.arc(px,py,p.gas?2.6:1.8,0,6.2832); mapCtx.fill();
  }

  mapCtx.fillStyle="rgba(255,157,47,.5)";
  mapCtx.font="10px ui-monospace,monospace"; mapCtx.textAlign="center";
  mapCtx.fillText((planets?planets.list.length:0)+" "+T("map.planets")+" · "+sun.t.k,ox,h-6);
}

/* ==== ui/dock.js ==== */
/* ================= нижняя панель состояния =================
   Двадцать показателей по бокам от радара: десять слева, десять справа.
   Обновляется пять раз в секунду, а не каждый кадр — цифры всё равно не
   читаются быстрее, а сорок обращений к DOM в кадре стоят дороже всей сцены. */

const dockL=document.getElementById("dock-l"), dockR=document.getElementById("dock-r");
let dockCells=null, dockT=0;

function dockBuild(){
  if(!dockL||!dockR) return;
  const rows=shipReadout();
  const half=Math.ceil(rows.length/2);
  const cell=(r)=>'<div class="cellx"><span>'+T(r[0])+'</span><b></b>'+
                  '<u><i style="width:0%"></i></u></div>';
  dockL.innerHTML=rows.slice(0,half).map(cell).join("");
  dockR.innerHTML=rows.slice(half).map(cell).join("");
  dockCells=[].concat(
    [].slice.call(dockL.querySelectorAll(".cellx")),
    [].slice.call(dockR.querySelectorAll(".cellx")));
}

/* смена языка: подписи перерисовываются, значения дойдут со следующим тиком */
function dockRelabel(){ dockCells=null; dockBuild(); }

function dockUpdate(dt){
  if(!dockCells) dockBuild();
  if(!dockCells) return;
  dockT+=dt;
  if(dockT<.2) return;
  dockT=0;
  const rows=shipReadout();
  for(let i=0;i<dockCells.length&&i<rows.length;i++){
    const c=dockCells[i], r=rows[i];
    c.children[1].textContent=r[1];
    c.children[2].children[0].style.width=Math.round(Math.max(0,Math.min(1,r[2]))*100)+"%";
    c.classList.toggle("hot", r[2]>.85 && i>1);
  }
}

/* ================= опции (клавиша O) =================
   Одно окно на все команды: список клавиш и выбор языка. Подсказка внизу

/* ==== ui/jumpmenu.js ==== */
/* ================= выбор цели для прыжка (клавиша J) =================
   Привод тянет на JUMP.rangeLy световых лет — дальше системы видно, но не
   достать. Класс светила известен заранее, его видно и издали; сколько там
   планет — нет, пока не побывали: иначе прыжок превращается в выбор из
   каталога, а не в разведку.

   Дом доступен всегда, с любого расстояния: иначе рано или поздно окажемся
   в двадцати годах от Солнца без обратного билета. */

const jumpEl=document.getElementById("jumpmenu");
let jumpOpen=false, jumpList=[], jumpSel=0;

function jumpRow(t,sel){
  const name = t.home ? "SOL" : t.seed.replace(/S$/,"");
  const star = t.star ? t.star.k+"-type" : T("jump.noStar");
  const pl = t.home ? "8 "+T("jump.planets")
    : (t.visited ? (t.planets===0 ? T("jump.noPlanets") : t.planets+" "+T("jump.planets")) : "?");
  const dist = t.d===null ? "—" : t.d.toFixed(1)+" "+T("u.ly");
  const note = t.home ? T("jump.home")
    : (!t.reach ? T("jump.far") : t.visited ? T("jump.visited") : T("jump.new"));
  return '<div class="jrow'+(sel?" sel":"")+(t.reach?"":" far")+'">'+
    '<b>'+name+'</b><span>'+star+'</span><span>'+pl+'</span>'+
    '<i>'+dist+'</i><em>'+note+'</em></div>';
}

function jumpMapSVG(){
  const here=systemAt(), R=54, cx=60, cy=60, h=JUMP.sectorLy/2;
  // круг дальности в тех же единицах, что и координаты карты
  const rr=R*(JUMP.rangeLy/h)/2;
  let s='<svg viewBox="0 0 120 120" class="jmap">';
  s+='<circle cx="60" cy="60" r="54" class="sec-ring"/>';
  s+='<circle cx="60" cy="60" r="'+rr.toFixed(1)+'" class="jrange"/>';
  for(let i=0;i<GALAXY.systems.length;i++){
    const it=GALAXY.systems[i];
    const x=cx+((it.x-here.x)/h)*R, y=cy+((it.y-here.y)/h)*R;
    const cls = i===GALAXY.at ? "sec-here"
      : (jumpList[jumpSel] && jumpList[jumpSel].i===i) ? "sec-target"
      : it.visited ? "sec-seen" : "sec-new";
    const r = it.star ? 3.1 : 1.7;
    s+='<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="'+r+'" class="'+cls+'"/>';
  }
  s+='</svg>';
  return s;
}

function buildJumpMenu(){
  if(!jumpEl) return;
  const targets=jumpTargets();
  jumpList=[];
  // дом идёт первой строкой, если мы не в нём
  if(systemAt().seed!=="SOL"){
    const home=systemById("SOL");
    jumpList.push({home:true, seed:"SOL", reach:true,
      d:home?systemDist(systemAt(),home):null,
      star:starTypeFor("SOL"), visited:true, i:-1});
  }
  jumpList=jumpList.concat(targets);
  if(jumpSel>=jumpList.length) jumpSel=0;

  jumpEl.innerHTML=
    '<div class="jtop"><h2>FRAME SHIFT DRIVE</h2>'+
      '<div class="jsub">'+T("jump.sub")+' '+JUMP.rangeLy.toFixed(1)+' '+T("u.ly")+'</div>'+
      '<div class="jhint">'+T("jump.hint")+'</div></div>'+
    '<div class="jbody">'+
      '<div class="jlist">'+jumpList.map((t,n)=>jumpRow(t,n===jumpSel)).join("")+'</div>'+
      '<div class="jmapbox">'+jumpMapSVG()+
        '<div class="si-cap">'+T("jump.sectorCap")+' '+JUMP.sectorLy+' '+T("u.ly")+'</div></div>'+
    '</div>';
}

function toggleJumpMenu(){
  if(!jumpEl||J.ph) return;               // во время прыжка меню не открыть
  jumpOpen=!jumpOpen;
  if(jumpOpen){ jumpSel=0; buildJumpMenu(); }
  jumpEl.classList.toggle("on",jumpOpen);
  wake();
}

function jumpMove(step){
  if(!jumpOpen||!jumpList.length) return;
  jumpSel=(jumpSel+step+jumpList.length)%jumpList.length;
  buildJumpMenu();
}

function jumpConfirm(){
  if(!jumpOpen||!jumpList.length) return;
  const t=jumpList[jumpSel];
  if(!t.reach) return;                     // вне дальности — привод не потянет
  jumpOpen=false; jumpEl.classList.remove("on");
  startJump(t);
}

/* ==== ui/sysinfo.js ==== */
/* ================= сводка по системе (клавиша I) =================
   Парад планет с настоящими дисками — те же процедурные текстуры, только
   мелкие, — точка прилёта, состав и карта сектора на двадцать систем. */

const infoEl=document.getElementById("sysinfo");
let infoOpen=false;

function fmtNum(n){ return Math.round(n).toLocaleString("ru-RU"); }

function sectorMapSVG(){
  const R=54, cx=60, cy=60;
  let s='<svg viewBox="0 0 120 120" class="secmap">';
  s+='<circle cx="60" cy="60" r="54" class="sec-ring"/><circle cx="60" cy="60" r="27" class="sec-ring"/>';
  for(let i=0;i<GALAXY.systems.length;i++){
    const it=GALAXY.systems[i];
    const h=JUMP.sectorLy/2, x=cx+(it.x/h)*R, y=cy+(it.y/h)*R;
    const cls = i===GALAXY.at ? "sec-here" : it.visited ? "sec-seen" : "sec-new";
    const r = it.star ? 3.1 : 1.7;   // со светилом — крупнее
    s+='<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="'+r+'" class="'+cls+'"/>';
    if(i===GALAXY.at) s+='<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="6.5" class="sec-mark"/>';
  }
  s+='</svg>';
  return s;
}

function planetCardHTML(p){
  const comp=p.comp.map(c=>
    '<div class="cmp"><span>'+T(c[0])+'</span><u><i style="width:'+c[1].toFixed(0)+'%"></i></u><b>'+
    c[1].toFixed(0)+'%</b></div>').join("");
  return '<div class="pcard">'+
    '<div class="pc-head">'+T("n."+p.name)+' · '+T(p.t.key)+(p.arrival?' <em>'+T("info.arrival")+'</em>':'')+'</div>'+
    '<div class="pc-grid">'+
      '<div><span>'+T("info.radius")+'</span><b>'+fmtNum(p.radius)+' '+T("u.km")+'</b></div>'+
      '<div><span>'+T("info.orbit")+'</span><b>'+p.au.toFixed(p.au<1?3:2)+' '+T("u.au")+'</b></div>'+
      '<div><span>'+T("info.day")+'</span><b>'+p.day+' '+T("u.h")+'</b></div>'+
      '<div><span>'+T("info.year")+'</span><b>'+(p.year>900?(p.year/365.25).toFixed(1)+' '+T("u.yr"):fmtNum(p.year)+' '+T("u.d"))+'</b></div>'+
      '<div><span>'+T("info.temp")+'</span><b>'+p.tempK+' K · '+Math.round(p.tempK-273)+' °C</b></div>'+
      '<div><span>'+T("info.moons")+'</span><b>'+p.moons+'</b></div>'+
      '<div><span>'+T("info.rings")+'</span><b>'+(p.rings?T("info.yes"):T("info.no"))+'</b></div>'+
    '</div><div class="pc-comp">'+comp+'</div></div>';
}

/* иконка станции: два модуля, панели и антенна — рисуется, а не грузится */
function stationIcon(){
  return '<svg viewBox="0 0 120 64" class="chan-ico">'+
    '<g class="ci">'+
      '<rect x="46" y="26" width="30" height="12" rx="3"/>'+
      '<rect x="30" y="28" width="16" height="8" rx="2"/>'+
      '<rect x="76" y="28" width="14" height="8" rx="2"/>'+
      '<rect x="14" y="16" width="14" height="32" class="pan"/>'+
      '<rect x="92" y="16" width="14" height="32" class="pan"/>'+
      '<line x1="28" y1="32" x2="14" y2="32"/><line x1="92" y1="32" x2="106" y2="32"/>'+
      '<line x1="61" y1="26" x2="61" y2="12"/><circle cx="61" cy="10" r="3"/>'+
      '<line x1="52" y1="38" x2="52" y2="46"/><line x1="70" y1="38" x2="70" y2="46"/>'+
    '</g></svg>';
}

/* задержка сигнала до дома: в системе Солнца — секунды, дальше — годы */
function commsDelay(){
  if(sun&&sun.solar){
    // расстояние от корабля до Земли, а не от Солнца: станция на её орбите
    const at=planets&&planets.at;
    const au=at?Math.hypot(at.x,at.y,at.z):1;
    const sec=au*499;                       // свет идёт 499 секунд на астрономическую единицу
    return sec<1 ? (sec*1000).toFixed(0)+" "+T("u.ms")
         : sec<90 ? sec.toFixed(1)+" "+T("u.s") : (sec/60).toFixed(1)+" "+T("u.min");
  }
  const ly=lyHome();
  return ly===null ? T("comms.outside") : (Math.round(ly*10)/10)+" "+T("u.yr");
}

function commsHTML(){
  const list=commsChannels();
  if(!list.length){
    return '<div class="comms"><div class="ch-head">'+T("comms.head")+'</div>'+
      '<div class="si-empty">'+T("comms.none")+'</div></div>';
  }
  const o=list[0], c=o.comms;
  const home=sun&&sun.solar;
  return '<div class="comms">'+
    '<div class="ch-head">'+T("comms.head")+'</div>'+
    '<div class="chan'+(home?" live":"")+'" id="chan-mir">'+
      stationIcon()+
      '<div class="chan-body">'+
        '<div class="chan-name">'+T(o.nameKey)+' <em>'+c.call+'</em></div>'+
        '<div class="chan-grid">'+
          '<div><span>'+T("comms.freq")+'</span><b>'+T(c.freqKey)+'</b></div>'+
          '<div><span>'+T("comms.mode")+'</span><b>'+T(c.modeKey)+'</b></div>'+
          '<div><span>'+T("comms.power")+'</span><b>'+c.power+' '+T("u.w")+'</b></div>'+
          '<div><span>'+T("comms.orbit")+'</span><b>'+c.orbitKm+' '+T("u.km")+' · '+c.incl+'°</b></div>'+
          '<div><span>'+T("comms.crew")+'</span><b>'+c.crew+'</b></div>'+
          '<div><span>'+T("comms.delay")+'</span><b>'+commsDelay()+'</b></div>'+
        '</div>'+
      '</div>'+
      '<button class="chan-btn" id="chan-test">'+T("comms.test")+'</button>'+
    '</div></div>';
}

function buildSysInfo(){
  if(!infoEl) return;
  const head='<div class="si-top"><h2>'+(sun&&sun.solar?T("sys.solar"):T("sys.system")+" "+SEED.replace(/S$/,""))+'</h2>'+
    '<div class="si-sub">'+(sun?(sun.name?T("n."+sun.name)+" · ":"")+T("star.fmt").replace("{k}",sun.t.k)+" · "+
      fmtNum(sun.t.rKm)+" "+T("u.km"):T("star.none"))+
    ' · '+T("info.sector")+' '+(GALAXY.at+1)+'/'+GALAXY.systems.length+'</div>'+
    '<button class="si-close" id="si-close">'+T("info.close")+' · I</button></div>';

  if(!planets){
    infoEl.innerHTML=head+'<div class="si-empty">'+T("info.empty")+
      '</div><div class="si-sector">'+sectorMapSVG()+'<div class="si-cap">'+T("info.sector")+' · '+GALAXY.systems.length+' '+T("info.systems")+'</div></div>'+
      commsHTML();
  }else{
    const parade=planets.list.map(p=>{
      // в каталоге планета освещена почти в лоб: с корабля половина из них
      // повёрнута ночной стороной, и парад выходит чёрным
      const real=p.light;
      p.light=[-.42,-.16,.89];
      const c=planetTexture(p,p.fbm,64);
      p.light=real;
      return '<figure class="pl'+(p.arrival?' at':'')+'">'+
        '<img src="'+c.toDataURL()+'" alt="">'+
        '<figcaption>'+T("n."+p.name)+'<span>'+T(p.t.key)+'</span></figcaption></figure>';
    }).join("");
    infoEl.innerHTML=head+
      '<div class="si-parade">'+parade+'</div>'+
      '<div class="si-cols">'+
        '<div class="si-left">'+planetCardHTML(planets.at)+'</div>'+
        '<div class="si-sector">'+sectorMapSVG()+'<div class="si-cap">'+T("info.sector")+' · '+
          GALAXY.systems.length+' '+T("info.systems")+' · '+T("info.visited")+' '+GALAXY.systems.filter(s=>s.visited).length+'</div></div>'+
      '</div>'+commsHTML();
  }
  const btn=document.getElementById("si-close");
  if(btn) btn.addEventListener("click",toggleSysInfo);
  const ct=document.getElementById("chan-test");
  if(ct) ct.addEventListener("click",()=>{
    const row=document.getElementById("chan-mir");
    if(commsCheck()&&row){
      row.classList.add("tx");
      setTimeout(()=>row.classList.remove("tx"),7000);
    }
  });
}

function toggleSysInfo(){
  if(!infoEl) return;
  infoOpen=!infoOpen;
  if(infoOpen) buildSysInfo();
  infoEl.classList.toggle("on",infoOpen);
  wake();
}

/* мир пересобрался — если сводка открыта, показать уже новую систему */
function syncSysInfo(){
  if(infoOpen) buildSysInfo();
}

/* ==== main.js ==== */
/* Стартуем дома: сид SOL — наша система, выход из прыжка у Земли */
const fromHash=(location.hash||"").replace(/^#/,"").toUpperCase();
const startSeed = fromHash==="SOL" ? "SOL"
  : (fromHash.replace(/[^0-9A-FS]/g,"") || "SOL");
resize();                        // размеры кадра нужны раньше мира:
                                 // от них зависит расстояние до планеты прилёта
buildGalaxy(startSeed);          // весь мир строится один раз, здесь
buildWorld(GALAXY.systems[0].seed);
applyStaticLang();        // подписи в разметке — на выбранном языке
setThrottle(.45);
requestAnimationFrame(t=>{last=t;requestAnimationFrame(frame)});
})();
</script>
