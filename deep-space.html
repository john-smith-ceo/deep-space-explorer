<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Полёт сквозь космос</title>
<meta name="description" content="Полноэкранная заставка: полёт сквозь глубокий космос. Небо генерируется процедурно из seed, гиперпрыжок уводит в новую систему. Управление тягой и курсом, без установки и зависимостей.">
<meta property="og:title" content="Полёт сквозь космос">
<meta property="og:description" content="Млечный Путь, гиперпрыжок, новые системы. Один HTML-файл без картинок.">
<meta property="og:type" content="website">
<style>
:root{--amber:#ff9d2f;--amber-d:#a35c12;--ice:#9fd4ff}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#000;overflow:hidden}
body{font-family:"JetBrains Mono","SF Mono",ui-monospace,Menlo,Consolas,monospace;color:var(--amber);cursor:default}
body.hidecursor{cursor:none}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%}

.hud{position:fixed;inset:0;pointer-events:none;z-index:10;transition:opacity .6s}
.hud.off{opacity:0}

/* тяга */
.throttle{position:absolute;left:36px;top:50%;transform:translateY(-50%);width:56px}
.tbar{position:relative;height:210px;border:1px solid rgba(255,157,47,.35);background:rgba(255,157,47,.04)}
.tfill{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(180deg,rgba(255,157,47,.85),rgba(255,157,47,.25));box-shadow:0 0 18px rgba(255,157,47,.5);transition:height .12s linear}
.tbar i{position:absolute;left:-6px;right:-6px;height:1px;background:rgba(255,157,47,.28)}
.tlabel{margin-top:10px;font-size:10px;letter-spacing:.18em;text-align:center;opacity:.75}
.tval{margin-top:3px;font-size:15px;text-align:center;text-shadow:0 0 12px rgba(255,157,47,.7)}

/* скорость */
.speed{position:absolute;right:38px;top:50%;transform:translateY(-50%);text-align:right}
.speed .n{font-size:38px;line-height:1;letter-spacing:.02em;text-shadow:0 0 20px rgba(255,157,47,.55)}
.speed .u{font-size:11px;letter-spacing:.24em;opacity:.7;margin-top:6px}
.fsd{margin-top:16px;font-size:10px;letter-spacing:.2em;color:var(--ice);opacity:0;transition:opacity .25s;text-shadow:0 0 14px rgba(159,212,255,.8)}
.fsd.on{opacity:1;animation:fsdpulse 1.1s ease-in-out infinite}
@keyframes fsdpulse{0%,100%{opacity:1}50%{opacity:.45}}

/* рамка-прицел */
.retic{position:absolute;left:50%;top:50%;width:104px;height:104px;transform:translate(-50%,-50%);opacity:.5}
.retic span{position:absolute;width:15px;height:15px;border:1px solid rgba(255,157,47,.65)}
.retic span:nth-child(1){left:0;top:0;border-right:0;border-bottom:0}
.retic span:nth-child(2){right:0;top:0;border-left:0;border-bottom:0}
.retic span:nth-child(3){left:0;bottom:0;border-right:0;border-top:0}
.retic span:nth-child(4){right:0;bottom:0;border-left:0;border-top:0}
.retic b{position:absolute;left:50%;top:50%;width:3px;height:3px;margin:-1.5px;background:var(--amber);box-shadow:0 0 10px var(--amber)}

/* верхняя строка */
.top{position:absolute;left:0;right:0;top:26px;text-align:center;font-size:10px;letter-spacing:.28em;opacity:.55}

/* подсказка */
.help{position:absolute;left:0;right:0;bottom:30px;text-align:center;font-size:11px;letter-spacing:.14em;color:rgba(255,157,47,.62);transition:opacity .8s}
.help.off{opacity:0}
.help kbd{border:1px solid rgba(255,157,47,.4);padding:2px 7px;margin:0 3px;border-radius:2px;font:inherit;color:var(--amber);background:rgba(255,157,47,.07)}

/* заставка старта */
.boot{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:#000;transition:opacity .9s}
.boot.gone{opacity:0;pointer-events:none}
.boot h1{font-size:clamp(22px,4.4vw,40px);font-weight:400;letter-spacing:.34em;text-transform:uppercase;text-shadow:0 0 26px rgba(255,157,47,.6)}
.boot p{font-size:11px;letter-spacing:.2em;color:rgba(255,157,47,.6);text-align:center;line-height:2.1}
.boot button{margin-top:6px;pointer-events:auto;cursor:pointer;background:rgba(255,157,47,.08);border:1px solid rgba(255,157,47,.5);color:var(--amber);font:inherit;font-size:12px;letter-spacing:.22em;padding:13px 34px;text-transform:uppercase;transition:.2s}
.boot button:hover{background:rgba(255,157,47,.2);box-shadow:0 0 26px rgba(255,157,47,.35)}
@media (max-width:700px){.throttle{left:14px;transform:translateY(-50%) scale(.8)}.speed{right:16px}.speed .n{font-size:28px}}

/* карта системы: маленький радар внизу слева */
/* top/right сбрасываем явно: общее правило canvas{inset:0} иначе
   прибивает радар к левому верхнему углу. Стоит по центру над подсказкой */
.sysmap{position:static;flex:0 0 auto;width:515px;height:293px;opacity:.9}
@media (max-width:1300px){.sysmap{width:396px;height:225px}}
@media (max-width:820px){.sysmap{width:264px;height:150px}}
@media (max-width:560px){.sysmap{display:none}}

/* сводка по системе */
.sysinfo{position:fixed;inset:0;z-index:30;display:none;overflow:auto;
  background:radial-gradient(120% 90% at 50% 0%,rgba(14,10,6,.93),rgba(0,1,8,.97));
  backdrop-filter:blur(3px);padding:38px clamp(18px,5vw,80px) 48px;
  font-size:12px;letter-spacing:.06em;color:rgba(255,196,120,.9)}
.sysinfo.on{display:block}
.si-top{display:flex;align-items:baseline;gap:18px;flex-wrap:wrap;
  border-bottom:1px solid rgba(255,157,47,.22);padding-bottom:14px;margin-bottom:26px}
.si-top h2{font-size:24px;font-weight:400;letter-spacing:.26em;color:var(--amber);
  text-shadow:0 0 22px rgba(255,157,47,.45)}
.si-sub{font-size:11px;letter-spacing:.2em;opacity:.66}
.si-close{margin-left:auto;background:rgba(255,157,47,.08);border:1px solid rgba(255,157,47,.42);
  color:var(--amber);font:inherit;font-size:11px;letter-spacing:.16em;padding:8px 18px;cursor:pointer}
.si-close:hover{background:rgba(255,157,47,.2)}

.si-parade{display:flex;gap:clamp(10px,2.2vw,26px);flex-wrap:wrap;margin-bottom:32px}
.si-parade .pl{text-align:center;opacity:.86;transition:.2s}
.si-parade .pl img{width:clamp(48px,7vw,86px);height:clamp(48px,7vw,86px);display:block;
  filter:drop-shadow(0 0 14px rgba(120,150,255,.16))}
.si-parade .pl.at{opacity:1}
.si-parade .pl.at img{filter:drop-shadow(0 0 18px rgba(159,212,255,.55))}
.si-parade figcaption{margin-top:8px;font-size:10px;letter-spacing:.16em}
.si-parade figcaption span{display:block;opacity:.55;letter-spacing:.05em;margin-top:3px}

.si-cols{display:flex;gap:clamp(20px,4vw,60px);flex-wrap:wrap;align-items:flex-start}
.si-left{flex:1 1 340px}
.pcard{border:1px solid rgba(255,157,47,.2);padding:18px 20px;background:rgba(255,157,47,.03)}
.pc-head{font-size:13px;letter-spacing:.2em;color:var(--amber);margin-bottom:16px}
.pc-head em{font-style:normal;font-size:10px;letter-spacing:.14em;color:var(--ice);
  border:1px solid rgba(159,212,255,.4);padding:2px 8px;margin-left:8px}
.pc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px 22px;margin-bottom:20px}
.pc-grid span{display:block;font-size:10px;opacity:.5;letter-spacing:.14em}
.pc-grid b{font-weight:400;font-size:14px;color:rgba(255,222,180,.95)}
.cmp{display:flex;align-items:center;gap:10px;margin-bottom:7px;font-size:11px}
.cmp span{flex:0 0 118px;opacity:.72}
.cmp u{flex:1;height:5px;background:rgba(255,157,47,.10);display:block;text-decoration:none}
.cmp i{height:5px;display:block;background:linear-gradient(90deg,rgba(255,157,47,.85),rgba(255,157,47,.3))}
.cmp b{flex:0 0 40px;text-align:right;font-weight:400;opacity:.8}

.si-sector{flex:0 0 240px;text-align:center}
.secmap{width:100%;max-width:240px}
.secmap .sec-ring{fill:none;stroke:rgba(255,157,47,.16)}
.secmap .sec-new{fill:rgba(255,157,47,.35)}
.secmap .sec-seen{fill:rgba(255,157,47,.75)}
.secmap .sec-here{fill:var(--ice)}
.secmap .sec-mark{fill:none;stroke:rgba(159,212,255,.8)}
.si-cap{margin-top:10px;font-size:10px;letter-spacing:.16em;opacity:.55}
.si-empty{opacity:.7;margin-bottom:28px}

/* меню выбора цели для прыжка */
.jumpmenu{position:fixed;inset:0;z-index:32;display:none;overflow:auto;
  background:radial-gradient(120% 90% at 50% 0%,rgba(12,9,5,.94),rgba(0,1,8,.975));
  backdrop-filter:blur(3px);padding:38px clamp(18px,5vw,80px) 48px;
  font-size:12px;letter-spacing:.06em;color:rgba(255,196,120,.9)}
.jumpmenu.on{display:block}
.jtop{display:flex;align-items:baseline;gap:20px;flex-wrap:wrap;
  border-bottom:1px solid rgba(255,157,47,.22);padding-bottom:14px;margin-bottom:24px}
.jtop h2{font-size:20px;font-weight:400;letter-spacing:.26em;color:var(--amber);
  text-shadow:0 0 20px rgba(255,157,47,.45)}
.jsub{font-size:11px;letter-spacing:.18em;opacity:.66}
.jhint{margin-left:auto;font-size:10px;letter-spacing:.16em;opacity:.5}
.jbody{display:flex;gap:clamp(20px,4vw,56px);flex-wrap:wrap;align-items:flex-start}
.jlist{flex:1 1 460px;min-width:0}
.jrow{display:grid;grid-template-columns:118px 96px 108px 96px 1fr;gap:12px;
  align-items:center;padding:9px 12px;border-left:2px solid transparent}
.jrow b{font-weight:400;font-size:14px;letter-spacing:.14em;color:rgba(255,222,180,.95)}
.jrow span{font-size:11px;opacity:.62}
.jrow i{font-style:normal;font-size:12px;opacity:.8;text-align:right}
.jrow em{font-style:normal;font-size:10px;letter-spacing:.14em;opacity:.5}
.jrow.sel{background:rgba(255,157,47,.10);border-left-color:var(--amber)}
.jrow.sel b{color:var(--amber);text-shadow:0 0 14px rgba(255,157,47,.5)}
.jrow.far{opacity:.34}
.jmapbox{flex:0 0 250px;text-align:center}
.jmap{width:100%;max-width:250px}
.jmap .sec-ring{fill:none;stroke:rgba(255,157,47,.16)}
.jmap .jrange{fill:rgba(159,212,255,.05);stroke:rgba(159,212,255,.4);stroke-dasharray:3 3}
.jmap .sec-new{fill:rgba(255,157,47,.35)}
.jmap .sec-seen{fill:rgba(255,157,47,.75)}
.jmap .sec-here{fill:var(--amber)}
.jmap .sec-target{fill:var(--ice)}

/* нижняя панель: показатели по бокам, радар посередине */
.dock{position:absolute;left:0;right:0;bottom:52px;display:flex;align-items:flex-end;
  justify-content:center;gap:clamp(10px,2vw,30px);padding:0 clamp(8px,2vw,26px);
  pointer-events:none}
/* Колонки состояния стоят под углом, как приборные панели в кокпите: левая
   развёрнута к нам правым краем, правая — левым. Наклон небольшой, иначе
   цифры на дальнем крае теряют читаемость. Подложка нужна, чтобы панель
   отделялась от неба, не закрывая его. */
.dock-side{flex:1 1 0;min-width:0;display:grid;grid-template-columns:repeat(2,1fr);
  gap:5px 16px;max-width:440px;padding:12px 16px;
  border:1px solid rgba(255,157,47,.14);border-radius:3px;
  background:linear-gradient(180deg,rgba(22,14,6,.34),rgba(8,6,10,.5));
  box-shadow:inset 0 1px 0 rgba(255,196,120,.07), 0 8px 26px rgba(0,0,0,.35);
  backdrop-filter:blur(1.5px)}
#dock-l{transform:perspective(1100px) rotateY(9deg) rotateX(3deg);
  transform-origin:right bottom}
#dock-r{transform:perspective(1100px) rotateY(-9deg) rotateX(3deg);
  transform-origin:left bottom}
.cellx{display:grid;grid-template-columns:1fr auto;grid-template-areas:"l v" "b b";
  gap:1px 8px;font-size:9px;letter-spacing:.1em;line-height:1.5}
.cellx span{grid-area:l;opacity:.44;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cellx b{grid-area:v;font-weight:400;font-size:10px;color:rgba(255,214,160,.92);white-space:nowrap}
.cellx u{grid-area:b;height:2px;background:rgba(255,157,47,.12);display:block;text-decoration:none}
.cellx i{display:block;height:2px;background:rgba(255,157,47,.62);transition:width .25s linear}
.cellx.hot b{color:#ffb066}
.cellx.hot i{background:rgba(255,120,60,.85)}
@media (max-width:1400px){.dock-side{grid-template-columns:1fr}.cellx span{font-size:8px}}
@media (max-width:1000px){.dock-side{display:none}}

/* панель звука: подбор на слух */
.sndcfg{position:fixed;right:16px;top:16px;z-index:26;width:236px;max-height:92vh;
  overflow-y:auto;display:none;padding:12px 13px 10px;
  border:1px solid rgba(255,157,47,.32);background:rgba(6,7,12,.9);
  backdrop-filter:blur(2px);font-size:10px;letter-spacing:.04em}
.sndcfg.on{display:block}
.sc-head{display:flex;align-items:center;font-size:10px;letter-spacing:.24em;
  color:var(--amber);margin-bottom:10px}
.sc-key{margin-left:auto;border:1px solid rgba(255,157,47,.4);padding:1px 6px;opacity:.7}
.sndcfg label{display:grid;grid-template-columns:1fr auto;align-items:center;margin-bottom:7px}
.sndcfg label span{opacity:.62}
.sndcfg label b{font-weight:400;color:rgba(255,214,160,.95);font-size:10px}
.sndcfg input[type=range]{grid-column:1/3;width:100%;height:2px;margin-top:4px;
  -webkit-appearance:none;appearance:none;background:rgba(255,157,47,.22);outline:none}
.sndcfg input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:9px;height:9px;
  background:var(--amber);cursor:pointer}
.sndcfg input[type=range]::-moz-range-thumb{width:9px;height:9px;border:0;
  background:var(--amber);cursor:pointer}
.sc-out{width:100%;margin-top:8px;background:rgba(0,0,0,.4);border:1px solid rgba(255,157,47,.25);
  color:rgba(255,214,160,.9);font:inherit;font-size:9px;padding:6px;resize:none}
.sc-btns{display:flex;gap:6px;margin-top:6px}
.sc-btns button{flex:1;background:rgba(255,157,47,.08);border:1px solid rgba(255,157,47,.4);
  color:var(--amber);font:inherit;font-size:9px;letter-spacing:.12em;padding:5px;cursor:pointer}
.sc-btns button:hover{background:rgba(255,157,47,.2)}
@media (max-width:900px){.sndcfg{display:none!important}}

/* связь: канал, параметры, иконка станции */
.comms{margin-top:34px;border-top:1px solid rgba(255,157,47,.2);padding-top:22px}
.ch-head{font-size:11px;letter-spacing:.28em;opacity:.55;margin-bottom:16px}
.chan{display:flex;align-items:center;gap:clamp(14px,2.4vw,30px);flex-wrap:wrap;
  border:1px solid rgba(255,157,47,.2);background:rgba(255,157,47,.03);padding:16px 20px}
.chan.live{border-color:rgba(159,212,255,.28)}
.chan-ico{width:120px;height:64px;flex:0 0 auto}
.chan-ico .ci rect{fill:rgba(255,196,120,.14);stroke:rgba(255,196,120,.75);stroke-width:1.2}
.chan-ico .ci rect.pan{fill:rgba(120,170,255,.18);stroke:rgba(150,200,255,.7)}
.chan-ico .ci line{stroke:rgba(255,196,120,.7);stroke-width:1.2}
.chan-ico .ci circle{fill:rgba(255,214,160,.9)}
.chan-body{flex:1 1 320px;min-width:0}
.chan-name{font-size:14px;letter-spacing:.18em;color:var(--amber);margin-bottom:12px}
.chan-name em{font-style:normal;font-size:10px;letter-spacing:.14em;opacity:.6;margin-left:8px}
.chan-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px 20px}
.chan-grid span{display:block;font-size:10px;opacity:.5;letter-spacing:.12em}
.chan-grid b{font-weight:400;font-size:12px;color:rgba(255,222,180,.95)}
.chan-btn{flex:0 0 auto;background:rgba(159,212,255,.08);border:1px solid rgba(159,212,255,.45);
  color:var(--ice);font:inherit;font-size:11px;letter-spacing:.14em;padding:10px 20px;cursor:pointer}
.chan-btn:hover{background:rgba(159,212,255,.18)}
.chan.tx{border-color:rgba(159,212,255,.7);box-shadow:0 0 26px rgba(159,212,255,.12)}
.chan.tx .chan-btn{background:rgba(159,212,255,.25);animation:txblink 1s ease-in-out infinite}
@keyframes txblink{0%,100%{opacity:1}50%{opacity:.5}}

/* опции: команды и язык */
.optmenu{position:fixed;inset:0;z-index:34;display:none;align-items:center;justify-content:center;
  background:rgba(2,3,10,.72);backdrop-filter:blur(3px)}
.optmenu.on{display:flex}
.opt-box{min-width:min(760px,92vw);border:1px solid rgba(255,157,47,.34);background:rgba(8,8,14,.94);
  padding:18px 20px 14px;font-size:12px;letter-spacing:.08em;color:rgba(255,196,120,.9)}
.opt-head{display:flex;align-items:center;font-size:11px;letter-spacing:.26em;
  color:var(--amber);margin-bottom:14px}
.opt-key{margin-left:auto;border:1px solid rgba(255,157,47,.4);padding:1px 7px;opacity:.7}
.lg-row{display:flex;align-items:center;gap:12px;padding:9px 12px;cursor:pointer;
  border-left:2px solid transparent}
.lg-row b{font-weight:400;font-size:14px;letter-spacing:.12em}
.lg-row i{font-style:normal;margin-left:auto;font-size:10px;opacity:.45}
.lg-row.sel{background:rgba(255,157,47,.10);border-left-color:var(--amber)}
.lg-row.cur b{color:var(--ice)}
.opt-hint{margin-top:12px;font-size:10px;letter-spacing:.1em;opacity:.45;line-height:1.7}

.opt-cols{display:flex;gap:clamp(18px,4vw,54px);flex-wrap:wrap}
.opt-cmds{flex:1 1 340px;min-width:0}
.opt-lang{flex:0 0 260px}
.opt-sub{font-size:10px;letter-spacing:.22em;opacity:.45;margin-bottom:10px}
.opt-row{display:flex;align-items:center;gap:12px;padding:4px 0;font-size:11px}
.opt-row kbd{flex:0 0 96px;border:1px solid rgba(255,157,47,.34);padding:2px 6px;
  border-radius:2px;text-align:center;font:inherit;font-size:10px;color:var(--amber);
  background:rgba(255,157,47,.06)}
.opt-row span{opacity:.72}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="hud" id="hud">
  <div class="top">DEEP SPACE · <span id="sys">SYSTEM</span></div>
  <div class="throttle">
    <div class="tbar"><div class="tfill" id="tfill" style="height:45%"></div>
      <i style="bottom:25%"></i><i style="bottom:50%"></i><i style="bottom:75%"></i>
    </div>
    <div class="tlabel" id="tlabel">THROTTLE</div>
    <div class="tval" id="tval">45%</div>
  </div>
  <div class="speed"><div class="n" id="spd">0</div><div class="u" id="uspeed">M/S</div>
    <div class="fsd" id="fsd">FRAME SHIFT DRIVE</div>
  </div>
  <div class="retic"><span></span><span></span><span></span><span></span><b></b></div>
  <div class="dock">
    <div class="dock-side" id="dock-l"></div>
    <canvas class="sysmap" id="sysmap" width="515" height="293"></canvas>
    <div class="dock-side" id="dock-r"></div>
  </div>
  <div class="help" id="help">
    <kbd>I</kbd> <span id="help-i">system</span>
    <kbd>J</kbd> <span id="help-j">jump target</span>
    <kbd>O</kbd> <span id="help-o">options</span>
  </div>
</div>

<div class="sysinfo" id="sysinfo"></div>
<div class="jumpmenu" id="jumpmenu"></div>
<div class="optmenu" id="optmenu"></div>
<div class="sndcfg" id="sndcfg"></div>

<div class="boot" id="boot">
  <h1>Deep Space</h1>
  <p><span id="boot1">a drift through dust and stars</span><br>
     <span id="boot2">arrows steer · wheel sets thrust · space boosts</span><br>
     <span id="boot3"><b>J</b> — jump to a nearby system · <b>I</b> — system report</span></p>
  <button id="go">Launch</button>
</div>
<script>
(function(){
"use strict";

/* ==== карты Земли: NASA Blue Marble, Earth at Night, Cloud Cover ====

  if(typeof buildJumpMenu==="function"&&typeof jumpOpen!=="undefined"&&jumpOpen) buildJumpMenu();
  if(typeof buildOptions==="function"&&typeof optOpen!=="undefined"&&optOpen) buildOptions();
  if(typeof sysEl!=="undefined"&&sysEl&&typeof SEED!=="undefined") sysLabel();
}

/* ==== core/canvas.js ==== */
const cv=document.getElementById("c"), ctx=cv.getContext("2d",{alpha:false});
let W=0,H=0,cx=0,cy=0,dpr=1,F=900;

/* ==== core/rng.js ==== */
/* ================= случайность с сидом =================
   Весь мир выводится из одной строки. Одинаковый seed — одинаковое небо
   на любой машине, поэтому систему можно записать и вернуться в неё. */

function mulberry32(a){
  return function(){
    a|=0; a=a+0x6D2B79F5|0;
    let t=Math.imul(a^a>>>15,1|a);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return ((t^t>>>14)>>>0)/4294967296;
  };
}
function hashStr(s){
  let h=2166136261;
  for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); }
  return h>>>0;
}
function newSeed(withStar){
  let s="";
  for(let i=0;i<6;i++) s+="0123456789ABCDEF"[Math.floor(Math.random()*16)];
  return withStar ? s+"S" : s;              // суффикс S — в системе есть звезда
}
let rnd=Math.random;                        // подменяется на сидированный при сборке мира

/* ==== data/star-class.js ==== */
/* ================= класс светила по сиду =================
   Считается отдельным потоком случайных чисел, привязанным к сиду: класс
   нужно знать и в меню прыжка, и при постройке базы, не строя систему. */

function starTypeFor(seed){
  if(seed==="SOL") return SUN_TYPES.filter(x=>x.k===SOLAR.star.k)[0];
  if(seed.charAt(seed.length-1)!=="S") return null;
  const r=mulberry32(hashStr("STAR:"+seed));
  return SUN_TYPES[Math.floor(r()*SUN_TYPES.length)];
}

/* ==== data/objects.js ==== */
/* ================= каталог объектов =================
   Всё, что может встретиться в системе помимо светила и планет: станции,
   маяки, обломки, аномалии, чужие корабли. Каждый объект — запись данных,
   а не код, и у каждого есть `where` — правила, где ему позволено быть.

   Движок ничего не знает про МИР. Он спрашивает у каталога: «что уместно в
   этой системе?» — и получает список. Добавить новый объект значит дописать
   запись сюда, а не править движок.

   Поля `where` (все необязательны, проверяются вместе):

     system     — сид системы, где объект есть. "SOL" или "A1B2C3S"
     notSystem  — где его точно нет
     requiresStar — true: только в системах со светилом
     starClass  — список классов светила: ["G","K"]
     planet     — имя планеты, у которой объект висит; система должна её иметь
     planetType — типы планет, при которых объект уместен: ["ocean","desert"]
     minPlanets / maxPlanets — сколько планет должно быть в системе
     chance     — доля систем, где объект встречается: 0…1. Бросок
                  детерминирован сидом и идентификатором объекта, поэтому
                  одна и та же система всегда даёт один и тот же ответ

   Поле `kind` определяет, кто объект использует: "station" — связь и сводка,
   дальше появятся "beacon", "wreck", "anomaly", "ship". */

const OBJECTS=[
  {
    id:"mir",
    kind:"station",
    nameKey:"comms.station",
    icon:"station",
    where:{ system:"SOL", planet:"Земля" },
    comms:{
      call:"MIR-1",
      freqKey:"comms.freq.v",
      modeKey:"comms.mode.v",
      power:5,
      orbitKm:390,
      incl:51.6,
      crew:3,
      voice:"mir"                       // ключ записи ответа в EARTH_MAPS
    }
  }
];

/* Бросок, привязанный к системе и объекту: одна и та же система всегда даёт
   один и тот же ответ, и он не зависит от того, в каком порядке мы летали. */
function objectRoll(id,seed){
  return mulberry32(hashStr("OBJ:"+id+":"+seed))();
}

function objectFits(o,ctx){
  const w=o.where||{};
  if(w.system && w.system!==ctx.seed) return false;
  if(w.notSystem && [].concat(w.notSystem).indexOf(ctx.seed)>=0) return false;
  if(w.requiresStar && !ctx.star) return false;
  if(w.starClass && (!ctx.star || w.starClass.indexOf(ctx.star.k)<0)) return false;
  if(w.planet && ctx.planetNames.indexOf(w.planet)<0) return false;
  if(w.planetType && !ctx.planetTypes.some(t=>w.planetType.indexOf(t)>=0)) return false;
  if(w.minPlanets!==undefined && ctx.planetCount<w.minPlanets) return false;
  if(w.maxPlanets!==undefined && ctx.planetCount>w.maxPlanets) return false;
  if(w.chance!==undefined && objectRoll(o.id,ctx.seed)>w.chance) return false;
  return true;
}

/* Что уместно в системе, где мы стоим. Вызывается после сборки мира —
   правилам нужны и светило, и список планет. */
function objectsHere(kind){
  if(typeof SEED==="undefined") return [];
  const ctx={
    seed:SEED,
    star:(typeof sun!=="undefined")?sun&&sun.t:null,
    planetCount:(typeof planets!=="undefined"&&planets)?planets.list.length:0,
    planetNames:(typeof planets!=="undefined"&&planets)?planets.list.map(p=>p.name):[],
    planetTypes:(typeof planets!=="undefined"&&planets)?planets.list.map(p=>p.t.k):[]
  };
  return OBJECTS.filter(o=>(!kind||o.kind===kind)&&objectFits(o,ctx));
}

/* ==== data/galaxy.js ==== */
/* ================= галактика: база систем =================
   Мир описывается данными и целиком строится один раз, при запуске. В базе
   лежит вся карта: координаты систем, их светила, состав планет и объекты,
   которые там есть. Дальше движок ничего не выдумывает — он материализует
   запись: считает по ней текстуры, шум и небо.

   Разделение намеренное. Данные системы весят десятки байт и считаются за
   микросекунды, поэтому их можно сделать сразу для всей карты. Текстуры
   планеты и шар светила стоят сотню миллисекунд — они рождаются только для
   той системы, куда мы вышли.

   Именованные системы — константы (`NAMED`), процедурные — правила. Обе
   попадают в одну базу и дальше неотличимы для движка.

   Координаты пока плоские: x и y в световых годах от центра карты. Высота
   появится, когда понадобится — записи это переживут. */

const NAMED=[
  { id:"SOL", seed:"SOL", x:0, y:0, name:"n.Солнце", solar:true, descKey:"desc.sol" }
];

let GALAXY={systems:[], byId:{}, at:0};

/* состав системы: то, что можно перечислить, и ничего тяжёлого */
function makeSystemRecord(seed,x,y,extra){
  const r=mulberry32(hashStr("SYS:"+seed));
  const star=starTypeFor(seed);
  const rec=Object.assign({
    id:seed, seed:seed, x:x, y:y,
    star:star, starClass:star?star.k:null,
    visited:false, planets:[], objects:[]
  }, extra||{});

  if(rec.solar){                                   // наша система — по таблице
    rec.planets=SOLAR.planets.map((p,i)=>Object.assign({i:i},p));
  }else if(star){
    const n=1+Math.floor(r()*PLANET.maxCount);
    let au=PLANET.orbit0*(.7+r()*.9);
    for(let i=0;i<n;i++){
      const t=PLANET.types[Math.floor(r()*PLANET.types.length)];
      const gas=t.k==="gas"||t.k==="ice-g";
      rec.planets.push({
        i:i, type:t.k, name:null,
        radius:Math.round(gas ? 24000+r()*46000 : 2400+r()*7600),
        au:au, phase:r()*6.2832,
        rings:gas&&r()<PLANET.ringChance,
        moons:Math.floor(r()*(gas?9:3)),
        day:Math.round(6+r()*70)
      });
      au*=PLANET.orbitStep*(.82+r()*.5);
    }
    rec.planets[Math.floor(r()*rec.planets.length)].arrival=true;
  }
  return rec;
}

/* объекты раскладываются по системам здесь же: правила спрашиваются один раз
   на весь мир, а не при каждом заходе в систему */
function placeObjects(rec){
  const ctx={
    seed:rec.seed,
    star:rec.star,
    planetCount:rec.planets.length,
    planetNames:rec.planets.map(p=>p.name).filter(Boolean),
    planetTypes:rec.planets.map(p=>p.type)
  };
  rec.objects=OBJECTS.filter(o=>objectFits(o,ctx)).map(o=>o.id);
}

function buildGalaxy(rootSeed){
  const r=mulberry32(hashStr("GALAXY:"+rootSeed));
  GALAXY={systems:[], byId:{}, at:0};

  NAMED.forEach(n=>GALAXY.systems.push(makeSystemRecord(n.seed,n.x,n.y,n)));

  const half=JUMP.sectorLy/2;
  while(GALAXY.systems.length<SECTOR_SIZE){
    let s="";
    for(let j=0;j<6;j++) s+="0123456789ABCDEF"[Math.floor(r()*16)];
    if(r()<SUN_SPREAD.chance) s+="S";
    if(GALAXY.byId[s]) continue;
    const a=r()*6.2832, d=(.2+r()*.8)*half;
    GALAXY.systems.push(makeSystemRecord(s, Math.cos(a)*d, Math.sin(a)*d));
    GALAXY.byId[s]=1;
  }
  GALAXY.systems.forEach(placeObjects);
  GALAXY.byId={};
  GALAXY.systems.forEach((s,i)=>{ GALAXY.byId[s.id]=i; });
  GALAXY.at=0;
  GALAXY.systems[0].visited=true;
}

function systemAt(){ return GALAXY.systems[GALAXY.at]; }
function systemById(id){ const i=GALAXY.byId[id]; return i===undefined?null:GALAXY.systems[i]; }

/* расстояние между записями в световых годах — карта пока плоская */
function systemDist(a,b){ return Math.hypot(a.x-b.x, a.y-b.y); }

/* цели прыжка: ближние первыми, дальше дальности привода — видно, но не достать */
function jumpTargets(){
  const here=systemAt(), out=[];
  GALAXY.systems.forEach((s,i)=>{
    if(i===GALAXY.at) return;
    const d=systemDist(here,s);
    out.push({i:i, seed:s.seed, d:d, reach:d<=JUMP.rangeLy,
              visited:s.visited, planets:s.visited?s.planets.length:null,
              star:s.star, rec:s});
  });
  out.sort((a,b)=>a.d-b.d);
  return out;
}

/* ==== engine/star.js ==== */
/* ================= объёмная звезда =================
   Шар получается не из градиента, а из физики: яркость точки диска зависит
   от того, под каким углом видна поверхность — лимбовое потемнение. Оно и
   лепит объём; без него любой градиент читается плоским кругом. Фактура
   берётся из трёхмерного шума, снятого прямо с поверхности сферы.

   Звезда неподвижна: с такого расстояния вращение всё равно не читается,
   а шестнадцать кадров оборота стоили сотню миллисекунд на входе в систему. */

function makeNoise3(){
  const N=12, g=new Float32Array(N*N*N);
  for(let i=0;i<g.length;i++) g[i]=rnd();
  const at=(x,y,z)=>g[(((x%N)+N)%N)*N*N+(((y%N)+N)%N)*N+(((z%N)+N)%N)];
  function n1(x,y,z){
    const xi=Math.floor(x), yi=Math.floor(y), zi=Math.floor(z);
    const xf=x-xi, yf=y-yi, zf=z-zi;
    const u=xf*xf*(3-2*xf), v=yf*yf*(3-2*yf), w=zf*zf*(3-2*zf);
    let s=0;
    for(let dx=0;dx<2;dx++) for(let dy=0;dy<2;dy++) for(let dz=0;dz<2;dz++)
      s+=(dx?u:1-u)*(dy?v:1-v)*(dz?w:1-w)*at(xi+dx,yi+dy,zi+dz);
    return s;
  }
  return (x,y,z)=>n1(x,y,z)*.54+n1(x*2.1+9,y*2.1+9,z*2.1+9)*.31+n1(x*4.4+3,y*4.4+3,z*4.4+3)*.15;
}

/* цвет класса со сдвигом оттенка: две звезды одного класса не должны быть
   близнецами. Сдвиг ведёт красный и синий каналы в разные стороны — выходит
   «теплее» или «холоднее», а не просто светлее */
function tint(rgb,h){
  const p=rgb.split(",").map(Number);
  return [Math.max(0,Math.min(255,p[0]*(1+h))),
          p[1],
          Math.max(0,Math.min(255,p[2]*(1-h)))];
}

/* текстура шара. Шум берётся по трёхмерной точке поверхности, поэтому
   у края фактура естественно сжимается — как на настоящем шаре.
   Класс звезды входит множителями: горячие ярче и глаже, холодные рябее */
function starTexture(sn){
  const C=STAR_CFG, t=sn.t, fbm=sn.fbm, T=SUN_TEX, R=T/2;
  const core=tint(t.core,sn.hue), col=tint(t.col,sn.hue);
  const nsc=C.noiseScale*t.noiseK, grn=C.granGain*t.granK,
        spa=C.spotAt*t.spotK, gain=C.gain*t.gainK;
  const c=document.createElement("canvas"); c.width=c.height=T;
  const g=c.getContext("2d"), img=g.createImageData(T,T), d=img.data;
  const rw=Math.max(.001,C.rimWidth);
  for(let py=0;py<T;py++) for(let px=0;px<T;px++){
    const o=(py*T+px)*4;
    const x=(px+.5-R)/R, y=(py+.5-R)/R, d2=x*x+y*y;
    if(d2>=1){ d[o+3]=0; continue; }
    const z=Math.sqrt(1-d2), r=Math.sqrt(d2);
    const n=fbm(x*nsc+7, y*nsc+7, z*nsc+7);
    let I=(C.limbBase+(1-C.limbBase)*Math.pow(z,C.limbPow))*(C.granBase+grn*n);
    if(n<spa) I*=C.spotDark;
    // вес края: узкая полоса у лимба темнеет (rim>0) или наливается светом (rim<0)
    const edge=Math.max(0,Math.min(1,(r-(1-rw))/rw));
    I*=1-C.rim*edge*edge;
    const w=1-z*C.tempMix;                       // край холоднее ядра
    const k=I*gain;
    d[o]  =Math.min(255,(core[0]+(col[0]-core[0])*w)*k);
    d[o+1]=Math.min(255,(core[1]+(col[1]-core[1])*w)*k);
    d[o+2]=Math.min(255,(core[2]+(col[2]-core[2])*w)*k);
    d[o+3]=Math.min(255,255*Math.min(1,(1-d2)*R*.9));   // мягкий лимб на пиксель-другой
  }
  g.putImageData(img,0,0);
  return c;
}

/* ореол ступенями со степенным спадом. Четырёх опорных точек мало — на них
   край получается ватным; рисуется в спрайт, пересобирать градиент из
   тридцати стопов на каждом кадре дороже всего остального в сцене */
function starHalo(sn){
  const C=STAR_CFG, t=sn.t, S=256, c=document.createElement("canvas"); c.width=c.height=S;
  const g=c.getContext("2d"), R=S/2;
  const steps=Math.max(2,Math.round(C.haloSteps));
  const col=tint(t.col,sn.hue).map(Math.round).join(",");
  const peak=C.haloPeak*t.haloK;                 // горячие светят сильнее
  const gr=g.createRadialGradient(R,R,R*.10,R,R,R);
  for(let i=0;i<=steps;i++){
    const q=i/steps;
    gr.addColorStop(q,"rgba("+col+","+(peak*Math.pow(1-q,C.haloFall)).toFixed(4)+")");
  }
  g.fillStyle=gr; g.beginPath(); g.arc(R,R,R,0,6.2832); g.fill();
  return c;
}

/* пересобрать шар и ореол по текущим настройкам — вызывается панелью */
function restyleSun(){
  if(!sun) return;
  sun.tex=starTexture(sun);
  sun.halo=starHalo(sun);
}

function drawSun(){
  if(!sun) return;
  rotate(sun);
  if(sun.z<=0) return;                        // светило за спиной
  const C=STAR_CFG;
  // видимый размер — это собственный размер светила на его удалённость
  const k=F/sun.z, sx=cx+sun.x*k, sy=cy+sun.y*k;
  // радиус выводится из настоящего размера светила и расстояния до него;
  // starVisual — единственное умышленное преувеличение во всей сцене
  const rAU=sun.t.rKm/SCALE.kmPerAU;
  const rad=Math.max(4, rAU*SCALE.starVisual*k*C.size*sun.dist*C.dist);
  const halo=Math.round(rad*C.haloScale*sun.t.gl);
  const asp=Math.max(.2,sun.aspect*C.haloAspect);            // ореол не обязан быть круглым
  if(sx<-halo*asp-halo||sx>W+halo*asp+halo||sy<-halo*asp-halo||sy>H+halo*asp+halo) return;
  ctx.globalCompositeOperation="lighter";
  ctx.globalAlpha=1-C.haloPulse*(.5+.5*Math.sin(S.t*.9))-C.haloPulse*.3*Math.sin(S.t*2.3);
  ctx.save();
  ctx.translate(sx,sy); ctx.rotate(sun.haloRot); ctx.scale(asp,1/asp);
  ctx.drawImage(sun.halo,-halo,-halo,halo*2,halo*2);
  ctx.restore();
  ctx.globalAlpha=1;
  ctx.drawImage(sun.tex,sx-rad,sy-rad,rad*2,rad*2);
  ctx.globalCompositeOperation="source-over";
}

/* ==== engine/planet.js ==== */
/* ================= планеты =================
   В системе их до девяти, но в небе рисуется ровно одна — та, к которой мы
   вышли из прыжка. Остальные существуют как данные: они нужны радару и
   сводке по клавише I, а рисовать их незачем, с такого расстояния это
   были бы точки, неотличимые от звёзд.

   Диск планеты, в отличие от звезды, освещён сбоку: яркость точки — это
   косинус угла между нормалью и направлением на светило. Отсюда серп,
   терминатор и ощущение шара, который висит в пустоте, а не светится сам. */

const ROMAN=["I","II","III","IV","V","VI","VII","VIII","IX"];

/* ================= карты Земли =================
   Три равнопромежуточные картинки NASA, вшитые в файл: дневная поверхность,
   ночные огни и облачный покров. Пока они не декодированы, Земля рисуется
   как любая другая планета — процедурно; когда готовы, диск пересобирается. */
const EARTH={ready:false, day:null, night:null, clouds:null};

(function(){
  if(typeof EARTH_MAPS==="undefined") return;
  let left=0;
  const grab=(src,key)=>{
    if(!src) return;
    left++;
    const im=new Image();
    im.onload=function(){
      const c=document.createElement("canvas");
      c.width=im.naturalWidth; c.height=im.naturalHeight;
      const g=c.getContext("2d"); g.drawImage(im,0,0);
      EARTH[key]={d:g.getImageData(0,0,c.width,c.height).data, w:c.width, h:c.height};
      if(--left===0){
        EARTH.ready=true;
        if(planets&&planets.at&&planets.at.earth) restylePlanet();
      }
    };
    im.onerror=function(){ if(--left===0) EARTH.ready=!!(EARTH.day&&EARTH.night&&EARTH.clouds); };
    im.src=src;
  };
  grab(EARTH_MAPS.day,"day"); grab(EARTH_MAPS.night,"night"); grab(EARTH_MAPS.clouds,"clouds");
})();

/* билинейная выборка: у края диска карта сжимается в разы, и ближайший
   пиксель даёт рваную кромку материков */
function mapLerp(m,u,v,out){
  const fx=u*m.w-.5, fy=v*m.h-.5;
  let x0=Math.floor(fx), y0=Math.floor(fy);
  const tx=fx-x0, ty=fy-y0;
  const x1=((x0+1)%m.w+m.w)%m.w, y1=Math.min(m.h-1,Math.max(0,y0+1));
  x0=((x0%m.w)+m.w)%m.w; y0=Math.min(m.h-1,Math.max(0,y0));
  const a=(y0*m.w+x0)*4, b=(y0*m.w+x1)*4, c=(y1*m.w+x0)*4, e=(y1*m.w+x1)*4;
  const w00=(1-tx)*(1-ty), w10=tx*(1-ty), w01=(1-tx)*ty, w11=tx*ty;
  out[0]=m.d[a]*w00+m.d[b]*w10+m.d[c]*w01+m.d[e]*w11;
  out[1]=m.d[a+1]*w00+m.d[b+1]*w10+m.d[c+1]*w01+m.d[e+1]*w11;
  out[2]=m.d[a+2]*w00+m.d[b+2]*w10+m.d[c+2]*w01+m.d[e+2]*w11;
  return out;
}

/* Диск Земли: дневная сторона берётся из карты, ночная — из огней, поверх
   ложатся облака. Терминатор мягкий: у настоящей планеты он размыт
   атмосферой, резкая граница выдаёт нарисованный шар. */
function earthTexture(p,size){
  const T=size||PLANET.texEarth, R=T/2, L=p.lightView||p.light, lon0=p.lon0||0;
  const c=document.createElement("canvas"); c.width=c.height=T;
  const g=c.getContext("2d"), img=g.createImageData(T,T), d=img.data;
  const D=EARTH.day, N=EARTH.night, C=EARTH.clouds;
  const cd=[0,0,0], cn=[0,0,0], cc=[0,0,0];
  for(let py=0;py<T;py++) for(let px=0;px<T;px++){
    const o=(py*T+px)*4;
    const x=(px+.5-R)/R, y=(py+.5-R)/R, d2=x*x+y*y;
    if(d2>=1){ d[o+3]=0; continue; }
    const z=Math.sqrt(1-d2);
    const lat=Math.asin(Math.max(-1,Math.min(1,-y)));        // север вверху
    let lon=Math.atan2(x,z)+lon0;
    let u=(lon/6.2832)%1; if(u<0) u+=1;
    const v=.5-lat/Math.PI;
    mapLerp(D,u,v,cd); mapLerp(N,u,v,cn); mapLerp(C,u,v,cc);
    const lam=x*L[0]+y*L[1]+z*L[2];
    const lit=Math.max(0,Math.min(1,(lam+.06)/.30));         // мягкий терминатор
    const sun=Math.pow(lit,.85);
    // суша и океан днём, огни городов ночью
    let r=cd[0]*sun, gg=cd[1]*sun, b=cd[2]*sun;
    const nf=(1-lit)*1.35;
    r+=cn[0]*nf; gg+=cn[1]*nf; b+=cn[2]*nf*1.1;
    // облака: белые, освещены тем же светом
    const cl=cc[0]/255*.92;
    if(cl>.02){
      const cs=250*sun+8;
      r=r*(1-cl)+cs*cl; gg=gg*(1-cl)+cs*cl; b=b*(1-cl)+(cs+4)*cl;
    }
    // атмосфера: голубой ободок, ярче там, где смотрим вдоль неё к свету
    const rim=Math.pow(1-z,3.0)*Math.pow(Math.max(0,lam+.25),.6)*1.9;
    r+=90*rim; gg+=140*rim; b+=225*rim;
    d[o]=Math.min(255,r); d[o+1]=Math.min(255,gg); d[o+2]=Math.min(255,b);
    d[o+3]=Math.min(255,255*Math.min(1,(1-d2)*R*.9));
  }
  g.putImageData(img,0,0);
  return c;
}

/* газовым гигантам полосы даёт функция широты, каменистым — трёхмерный шум */
function planetTexture(p,fbm,size){
  if(p.earth&&EARTH.ready) return earthTexture(p,size);
  const T=size||PLANET.tex, R=T/2, ty=p.t;
  const base=ty.base.split(",").map(Number), alt=ty.alt.split(",").map(Number);
  const atm=ty.atmCol.split(",").map(Number);
  const L=p.lightView||p.light;                       // направление на звезду
  const c=document.createElement("canvas"); c.width=c.height=T;
  const g=c.getContext("2d"), img=g.createImageData(T,T), d=img.data;
  for(let py=0;py<T;py++) for(let px=0;px<T;px++){
    const o=(py*T+px)*4;
    const x=(px+.5-R)/R, y=(py+.5-R)/R, d2=x*x+y*y;
    if(d2>=1){ d[o+3]=0; continue; }
    const z=Math.sqrt(1-d2);
    let n=fbm(x*p.noise+11, y*p.noise+11, z*p.noise+11);
    if(ty.band){                                      // полосы по широте
      const lat=Math.asin(Math.max(-1,Math.min(1,y)));
      n=n*.42+.58*(.5+.5*Math.sin(lat*p.bands+n*2.6));
    }
    const w=Math.max(0,Math.min(1,(n-.34)*2.1));      // смесь двух грунтов
    let r=base[0]+(alt[0]-base[0])*w,
        gg=base[1]+(alt[1]-base[1])*w,
        b=base[2]+(alt[2]-base[2])*w;
    // освещение: косинус к светилу плюс немного рассеянного света
    const lam=Math.max(0, x*L[0]+y*L[1]+z*L[2]);
    const lit=.035+.965*Math.pow(lam,.85);
    r*=lit; gg*=lit; b*=lit;
    // атмосферный ободок: светится там, где поверхность уходит от нас к свету
    if(ty.atm>0){
      const rim=Math.pow(1-z,2.4)*Math.pow(Math.max(0,lam),.45)*ty.atm*2.3;
      r+=atm[0]*rim; gg+=atm[1]*rim; b+=atm[2]*rim;
    }
    d[o]=Math.min(255,r); d[o+1]=Math.min(255,gg); d[o+2]=Math.min(255,b);
    d[o+3]=Math.min(255,255*Math.min(1,(1-d2)*R*.9));
  }
  g.putImageData(img,0,0);
  return c;
}

/* Кольца: два спрайта одного рисунка — светлый для самих колец и чёрный
   той же плотности. Второй нужен, чтобы положить тень колец на диск: осветлять
   и затемнять одной картинкой нельзя. */
const RING_FLAT=.28, RING_R=2.3;      // сжатие эллипса и внешний радиус в радиусах планеты

function ringTexture(p){
  const S=512, c=document.createElement("canvas"), d=document.createElement("canvas");
  c.width=c.height=d.width=d.height=S;
  const g=c.getContext("2d"), gd=d.getContext("2d"), R=S/2;
  const col=p.t.base.split(",").map(Number);
  for(let i=0;i<44;i++){
    const q=.52+ .46*(i/44);
    const gap=Math.abs(q-.72)<.03 ? .15 : 1;          // щель
    const a=(.05+.10*Math.abs(Math.sin(i*1.7)))*gap;
    g.strokeStyle="rgba("+Math.round(col[0]*1.15)+","+Math.round(col[1]*1.1)+","+
                  Math.round(col[2])+","+a+")";
    g.lineWidth=S*.0085;
    g.beginPath(); g.arc(R,R,R*q,0,6.2832); g.stroke();
    gd.strokeStyle="rgba(0,0,0,"+(a*3.4).toFixed(3)+")";
    gd.lineWidth=S*.0085;
    gd.beginPath(); gd.arc(R,R,R*q,0,6.2832); gd.stroke();
  }
  return {lit:c, dark:d};
}

/* состав выдумывается по типу, но не наобум: доли нормируются к сотне */
function planetComposition(t,r){
  // состав хранится ключами словаря: подписи переводятся, доли — нет
  const mix = t.k==="gas"   ? [["c.hydrogen",62,18],["c.helium",22,10],["c.methane",5,4],["c.ammonia",3,3]]
            : t.k==="ice-g" ? [["c.hydrogen",42,14],["c.helium",16,8],["c.methane",18,8],["c.ice",16,8]]
            : t.k==="ice"   ? [["c.waterIce",54,16],["c.silicates",22,10],["c.ammoniaIce",12,8],["c.iron",6,4]]
            : t.k==="ocean" ? [["c.water",58,14],["c.silicates",24,10],["c.iron",12,6],["c.carbon",4,3]]
            : t.k==="lava"  ? [["c.silicates",48,12],["c.iron",30,10],["c.sulphur",10,6],["c.basalt",8,5]]
            : t.k==="iron"  ? [["c.iron",62,12],["c.nickel",18,8],["c.silicates",14,8],["c.sulphur",4,3]]
            : t.k==="desert"? [["c.silicates",56,12],["c.iron",20,8],["c.oxides",16,8],["c.carbon",4,3]]
            :                 [["c.silicates",52,12],["c.iron",26,10],["c.magnesium",14,8],["c.carbon",5,4]];
  const raw=mix.map(m=>[m[0], Math.max(1, m[1]+(r()*2-1)*m[2])]);
  const sum=raw.reduce((a,m)=>a+m[1],0);
  return raw.map(m=>[m[0], m[1]/sum*100]);
}

/* Система живёт в одних координатах: начало — звезда, планеты стоят на
   орбитах, корабль — рядом с той, к которой мы вышли. Всё, что рисуется и
   в небе, и на радаре, выводится из одного вектора «объект минус корабль»,
   поэтому карта не может разойтись с тем, что видно в кадре. */
let SHIP=[0,0,0];                 // положение корабля в системных единицах

function sysVec(o){               // вектор от корабля к объекту
  o.x=o.px-SHIP[0]; o.y=o.py-SHIP[1]; o.z=o.pz-SHIP[2];
}

/* вся система: планеты по орбитам, одна из них — точка прилёта */
/* Собрать планету из честных величин: радиус в километрах, орбита в
   астрономических единицах. Всё остальное — период, температура, положение —
   выводится, а не выдумывается. */
function makePlanet(sn,i,o){
  const t=typeof o.type==="string"
    ? PLANET.types.filter(x=>x.k===o.type)[0]
    : o.type;
  const gas=t.k==="gas"||t.k==="ice-g";
  const au=o.au, ph=o.phase!==undefined?o.phase:rnd()*6.2832;
  // третий закон Кеплера: период растёт как большая полуось в степени 3/2
  const year=o.year!==undefined ? o.year
    : Math.round(365.25*Math.pow(au,1.5)/Math.sqrt(sn.t.mass));
  // равновесная температура: светимость на квадрат расстояния
  const temp=o.tempK!==undefined ? o.tempK
    : Math.round(278*Math.pow(sn.t.lum,.25)/Math.sqrt(au));
  const p={
    i:i, t:t, gas:gas,
    name:o.name||ROMAN[i],
    radius:Math.round(o.radius),
    rAU:o.radius/SCALE.kmPerAU,                     // радиус в единицах системы
    au:au, orbit:au, phase:ph,
    px:Math.cos(ph)*au, py:(rnd()-.5)*au*.05, pz:Math.sin(ph)*au,
    fbm:makeNoise3(),
    noise:1.6+rnd()*3.4,
    bands:6+Math.floor(rnd()*14),
    rings:o.rings!==undefined?o.rings:(gas&&rnd()<PLANET.ringChance),
    tilt:(rnd()-.5)*1.1,
    day:o.day!==undefined?o.day:Math.round(6+rnd()*70),
    year:year, tempK:temp,
    moons:o.moons!==undefined?o.moons:Math.floor(rnd()*(gas?9:3)),
    earth:!!o.earth,
    lon0:rnd()*6.2832                       // какой стороной планета к нам повёрнута
  };
  const ql=Math.hypot(p.px,p.py,p.pz)||1;
  p.light=[-p.px/ql, -p.py/ql, -p.pz/ql];            // свет идёт от звезды
  p.comp=planetComposition(t,rnd);
  return p;
}

/* Тела собираются по записи из базы: состав системы посчитан один раз при
   запуске, здесь он только обрастает текстурами и шумом. Движок больше не
   решает, что за планеты в системе, — он их материализует. */
function buildPlanets(sn,rec){
  const list=(rec&&rec.planets?rec.planets:[]).map((spec,i)=>makePlanet(sn,i,spec));
  if(!list.length) return {list:[], at:null};
  let at=list.filter((p,i)=>rec.planets[i].arrival)[0];
  if(!at){ at=list[Math.min(list.length-1,2)]; }
  at.arrival=true;
  return {list:list, at:at};
}

/* Поставить корабль. Планета прилёта оказывается почти по курсу, а нужное
   расстояние выводится из желаемого видимого размера: сколько долей экрана
   она должна занять, столько и отступаем. Всё остальное — звезда, прочие
   планеты — получает свои векторы из той же точки, без отдельных допущений. */
/* повернуть единичный вектор на угол a вокруг случайной оси, ему перпендикулярной */
function tiltVec(v,a){
  let ax=Math.abs(v[1])>.9 ? [1,0,0] : [0,1,0];
  const c1=[v[1]*ax[2]-v[2]*ax[1], v[2]*ax[0]-v[0]*ax[2], v[0]*ax[1]-v[1]*ax[0]];
  const l1=Math.hypot(c1[0],c1[1],c1[2])||1;
  const e1=[c1[0]/l1,c1[1]/l1,c1[2]/l1];
  const e2=[v[1]*e1[2]-v[2]*e1[1], v[2]*e1[0]-v[0]*e1[2], v[0]*e1[1]-v[1]*e1[0]];
  const th=rnd()*6.2832, cs=Math.cos(a), sn=Math.sin(a);
  const px=e1[0]*Math.cos(th)+e2[0]*Math.sin(th),
        py=e1[1]*Math.cos(th)+e2[1]*Math.sin(th),
        pz=e1[2]*Math.cos(th)+e2[2]*Math.sin(th);
  const r=[v[0]*cs+px*sn, v[1]*cs+py*sn, v[2]*cs+pz*sn];
  const l=Math.hypot(r[0],r[1],r[2])||1;
  return [r[0]/l, r[1]/l, r[2]/l];
}

function placeArrival(sn,pl){
  const p=pl.at;
  /* Выходим со стороны светила, но не в лоб: угол к лучу 35–60° оставляет
     три четверти диска освещёнными и серп ночи с терминатором. */
  const toStar=[-p.px, -p.py, -p.pz];
  const ls=Math.hypot(toStar[0],toStar[1],toStar[2])||1;
  const look=tiltVec([toStar[0]/ls,toStar[1]/ls,toStar[2]/ls], .61+rnd()*.44);
  const fwd=[-look[0], -look[1], -look[2]];          // куда смотрит нос корабля
  const want=PLANET.arriveMin+rnd()*(PLANET.arriveMax-PLANET.arriveMin);
  const Fn=(Math.max(W,H)||1600)*.78, mn=Math.min(W,H)||900;
  const d=Math.max(p.rAU*1.6, p.rAU*Fn/(want*mn));   // ближе поверхности не подходим
  SHIP=[p.px-fwd[0]*d, p.py-fwd[1]*d, p.pz-fwd[2]*d];

  /* Дальше вся система переводится в оси камеры. Иначе выходит так: корабль
     ставим по свету, а камера по-прежнему смотрит вдоль оси системы — и
     планета оказывается за краем кадра.

     Ось взгляда чуть отклонена от направления на планету: строго по центру
     кадр выходит мёртво симметричным. */
  const axis=tiltVec(fwd, .10+rnd()*.13);
  let upv=Math.abs(axis[1])>.92 ? [0,0,1] : [0,1,0];
  const rt=[upv[1]*axis[2]-upv[2]*axis[1], upv[2]*axis[0]-upv[0]*axis[2], upv[0]*axis[1]-upv[1]*axis[0]];
  const rl=Math.hypot(rt[0],rt[1],rt[2])||1;
  rt[0]/=rl; rt[1]/=rl; rt[2]/=rl;
  const up=[axis[1]*rt[2]-axis[2]*rt[1], axis[2]*rt[0]-axis[0]*rt[2], axis[0]*rt[1]-axis[1]*rt[0]];
  const toCam=(v)=>[ v[0]*rt[0]+v[1]*rt[1]+v[2]*rt[2],
                    -(v[0]*up[0]+v[1]*up[1]+v[2]*up[2]),   // экранный y смотрит вниз
                     v[0]*axis[0]+v[1]*axis[1]+v[2]*axis[2] ];
  /* У позиций ось z идёт вглубь кадра, у нормалей диска — наоборот, к
     зрителю. Свет живёт в системе нормалей, поэтому его z берётся с обратным
     знаком: иначе освещённой оказывается та сторона, которую мы не видим. */
  const toCamLight=(v)=>[ v[0]*rt[0]+v[1]*rt[1]+v[2]*rt[2],
                         -(v[0]*up[0]+v[1]*up[1]+v[2]*up[2]),
                        -(v[0]*axis[0]+v[1]*axis[1]+v[2]*axis[2]) ];

  for(let i=0;i<pl.list.length;i++){
    const q=pl.list[i];
    const v=toCam([q.px-SHIP[0], q.py-SHIP[1], q.pz-SHIP[2]]);
    q.x=v[0]; q.y=v[1]; q.z=v[2];
    q.lightView=toCamLight(q.light);                 // свет — в осях нормалей
  }
  sn.px=0; sn.py=0; sn.pz=0;
  const sv=toCam([-SHIP[0],-SHIP[1],-SHIP[2]]);
  sn.x=sv[0]; sn.y=sv[1]; sn.z=sv[2];                // звезда там, где ей положено

  p.tex=planetTexture(p,p.fbm);
  p.ring=p.rings?ringTexture(p):null;
  return p;
}

/* пересобрать диск планеты прилёта — нужно, когда карты Земли догрузились */
function restylePlanet(){
  if(!planets||!planets.at) return;
  planets.at.tex=planetTexture(planets.at,planets.at.fbm);
}

/* векторы на объекты крутятся вместе с небом — по ним рисуется и кадр, и радар */
function rotateSystem(){
  if(!planets) return;
  for(let i=0;i<planets.list.length;i++) rotate(planets.list[i]);
}

function drawPlanet(){
  if(!planets||!planets.at||!planets.at.tex) return;
  const p=planets.at;
  if(p.z<=p.rAU*.25) return;                  // планета за спиной или мы внутри неё
  const k=F/p.z, sx=cx+p.x*k, sy=cy+p.y*k;
  const rad=p.rAU*k*SCALE.planetVisual;       // видимый радиус — следствие расстояния
  if(sx<-rad*3||sx>W+rad*3||sy<-rad*3||sy>H+rad*3) return;

  /* Планета — тело, а не свечение: рисуется поверх фона, а не складывается с
     ним. Режим приходит сюда включённым от звёздных слоёв, и полагаться на то,
     что предыдущая функция за собой прибрала, нельзя: при светиле за краем
     кадра она выходит раньше — тогда сквозь ночную сторону видно звёзды. */
  const prevOp=ctx.globalCompositeOperation;
  ctx.globalCompositeOperation="source-over";
  if(!p.ring){
    ctx.drawImage(p.tex,sx-rad,sy-rad,rad*2,rad*2);
    ctx.globalCompositeOperation=prevOp;
    return;
  }

  /* Кольцо огибает планету, а не висит за ней: дальняя дуга рисуется до
     диска, ближняя — после. Между ними ложатся тени. */
  const Rr=rad*RING_R, L=p.light;
  const ring=(half)=>{                       // half: -1 дальняя, +1 ближняя, 0 всё
    ctx.save();
    ctx.translate(sx,sy); ctx.rotate(p.tilt); ctx.scale(1,RING_FLAT);
    if(half){
      ctx.beginPath();
      ctx.rect(-Rr, half>0?0:-Rr, Rr*2, Rr);
      ctx.clip();
    }
    ctx.globalCompositeOperation="lighter";
    ctx.drawImage(p.ring.lit,-Rr,-Rr,Rr*2,Rr*2);
    ctx.restore();
    ctx.globalCompositeOperation="source-over";
  };

  ring(-1);                                   // дальняя дуга

  /* тень планеты на кольце: полоса, уходящая от диска прочь от света */
  const lx=-L[0], ly=-L[1], ll=Math.hypot(lx,ly)||1;
  ctx.save();
  ctx.translate(sx,sy); ctx.rotate(p.tilt); ctx.scale(1,RING_FLAT);
  ctx.beginPath(); ctx.arc(0,0,Rr,0,6.2832); ctx.clip();     // только по кольцу
  ctx.rotate(-p.tilt);                                       // полоса живёт в экранных осях
  ctx.rotate(Math.atan2(ly/ll,lx/ll));
  ctx.fillStyle="rgba(0,0,4,.62)";
  ctx.fillRect(0,-rad*.92,Rr*2.4,rad*1.84);
  ctx.restore();

  ctx.drawImage(p.tex,sx-rad,sy-rad,rad*2,rad*2);            // сам диск

  /* тень колец на диске: тот же рисунок чёрным, сдвинутый по лучу света
     и прижатый к плоскости кольца */
  ctx.save();
  ctx.beginPath(); ctx.arc(sx,sy,rad*.995,0,6.2832); ctx.clip();
  ctx.translate(sx-L[0]*rad*.55, sy-L[1]*rad*.55);
  ctx.rotate(p.tilt); ctx.scale(1,RING_FLAT*.42);
  ctx.globalAlpha=.7;
  ctx.drawImage(p.ring.dark,-Rr,-Rr,Rr*2,Rr*2);
  ctx.globalAlpha=1;
  ctx.restore();

  ring(1);                                                   // ближняя дуга поверх диска
  ctx.globalCompositeOperation=prevOp;                       // вернуть режим слоям пыли
}

/* ==== engine/world.js ==== */
/* ================= небо ================= */

/* направление на сфере: доля inPlane тяготеет к плоскости галактики,
   остальное — равномерное гало */
function galDir(inPlane,thick){
  const th=rnd()*6.2832;
  let lat;
  if(rnd()<inPlane){
    let g=0; for(let i=0;i<3;i++) g+=rnd();  // сумма трёх ≈ нормальное распределение
    lat=(g/1.5-1)*thick;
  }else{
    lat=Math.asin(rnd()*2-1);
  }
  const cl=Math.cos(lat), sl=Math.sin(lat);
  const x=cl*Math.cos(th), y=sl, z=cl*Math.sin(th);
  const c=Math.cos(GAL_TILT), s=Math.sin(GAL_TILT);
  return {x:x*c-y*s, y:x*s+y*c, z:z};
}

/* спрайты рисуются один раз, дальше только drawImage */
function starSprite(col){
  const S=24, c=document.createElement("canvas"); c.width=c.height=S;
  const g=c.getContext("2d"), r=S/2;
  // ядро мелкое и резкое, ореол широкий и слабый — так звезда читается точкой
  // со свечением, а не шариком с ровным краем
  const gr=g.createRadialGradient(r,r,0,r,r,r);
  gr.addColorStop(0,   "rgba("+col+",1)");
  gr.addColorStop(.09, "rgba("+col+",.95)");
  gr.addColorStop(.20, "rgba("+col+",.38)");
  gr.addColorStop(.42, "rgba("+col+",.10)");
  gr.addColorStop(.72, "rgba("+col+",.025)");
  gr.addColorStop(1,   "rgba("+col+",0)");
  g.fillStyle=gr; g.fillRect(0,0,S,S);
  return c;
}
/* спектральные классы: у слабых звёзд глаз цвета не различает, поэтому
   оттенок достаётся только ярким */
const STAR_SPR=STAR_COL.map(starSprite);

function hsl2rgb(h,s,l){
  h=(h%360+360)%360; s/=100; l/=100;
  const c=(1-Math.abs(2*l-1))*s, x=c*(1-Math.abs((h/60)%2-1)), m=l-c/2;
  let r,g,b;
  if(h<60){r=c;g=x;b=0} else if(h<120){r=x;g=c;b=0} else if(h<180){r=0;g=c;b=x}
  else if(h<240){r=0;g=x;b=c} else if(h<300){r=x;g=0;b=c} else {r=c;g=0;b=x}
  return Math.round((r+m)*255)+","+Math.round((g+m)*255)+","+Math.round((b+m)*255);
}

/* облако газа: одиннадцать вытянутых пятен под круглой маской. Без маски
   на небе читаются прямоугольные обрезы спрайта вместо газа */
function cloudSprite(col,peak){
  const S=256, c=document.createElement("canvas"); c.width=c.height=S;
  const g=c.getContext("2d");
  for(let i=0;i<11;i++){
    const ox=S/2+(rnd()-.5)*S*.34, oy=S/2+(rnd()-.5)*S*.34;
    const rr=S*(.11+rnd()*.20);
    const sq=.22+rnd()*.55;
    g.save();
    g.translate(ox,oy); g.rotate(rnd()*6.2832); g.scale(1,sq);
    const gr=g.createRadialGradient(0,0,0,0,0,rr);
    gr.addColorStop(0,"rgba("+col+","+peak+")");
    gr.addColorStop(.5,"rgba("+col+","+(peak*.34).toFixed(3)+")");
    gr.addColorStop(1,"rgba("+col+",0)");
    g.fillStyle=gr; g.fillRect(-rr,-rr/sq,rr*2,rr*2/sq);
    g.restore();
  }
  g.globalCompositeOperation="destination-in";
  const m=g.createRadialGradient(S/2,S/2,0,S/2,S/2,S/2);
  m.addColorStop(0,"rgba(0,0,0,1)"); m.addColorStop(.5,"rgba(0,0,0,.95)");
  m.addColorStop(.8,"rgba(0,0,0,.45)"); m.addColorStop(1,"rgba(0,0,0,0)");
  g.fillStyle=m; g.fillRect(0,0,S,S);
  return c;
}

/* подпись системы в верхней строке — зависит от языка, потому вынесена */
function sysLabel(){
  if(typeof sysEl==="undefined"||!sysEl) return;
  const name = sun&&sun.solar ? T("sys.solar")
    : T("sys.system")+" "+String(SEED).replace(/S$/,"");
  sysEl.textContent = name+" · "+(sun ? T("star.fmt").replace("{k}",sun.t.k) : T("sys.noStar"));
}

/* ================= мир ================= */
let SEED="", GAS_SPR=[], DUST_SPR=[];
let gas=[], dust=[], grit=[], far=[], sun=null, planets=null;

function buildWorld(seed){
  SEED=seed;
  const rec=systemById(seed);          // запись из базы: состав уже посчитан
  rnd=mulberry32(hashStr(seed));

  /* палитра туманности выводится из seed: базовый тон плюс соседние,
     один контрастный на другой стороне круга */
  const zone=HUE_ZONES[Math.floor(rnd()*HUE_ZONES.length)];
  const baseHue=zone[0]+rnd()*(zone[1]-zone[0]), spread=34+rnd()*54;
  GAS_SPR=[];
  for(let i=0;i<5;i++){
    const h = i===4 ? baseHue+152+rnd()*56 : baseHue+(rnd()-.5)*spread;
    GAS_SPR.push(cloudSprite(hsl2rgb(h, 46+rnd()*32, 31+rnd()*15), .19));
  }
  DUST_SPR=[0,1,2,3].map(()=>cloudSprite("0,1,6",.50));

  gas=[]; dust=[];
  const gasN=SKY.gasMin+Math.floor(rnd()*SKY.gasVar);
  for(let i=0;i<gasN;i++){
    const d=galDir(SKY.inPlaneGas,SKY.thickGas), r=SKY.gasR;
    gas.push({x:d.x*r,y:d.y*r,z:d.z*r,
      s:260+rnd()*580, e:.28+rnd()*.52,
      rot:rnd()*6.2832, a:.17+rnd()*.26,
      sp:GAS_SPR[Math.floor(rnd()*GAS_SPR.length)]});
  }
  for(let i=0;i<SKY.dustN;i++){
    const d=galDir(SKY.inPlaneDust,SKY.thickDust), r=SKY.dustR;
    dust.push({x:d.x*r,y:d.y*r,z:d.z*r,
      s:170+rnd()*360, e:.07+rnd()*.15,
      rot:(rnd()-.5)*.5, a:.26+rnd()*.34,
      sp:DUST_SPR[Math.floor(rnd()*DUST_SPR.length)]});
  }

  /* слабые звёзды: разложены по полосам яркости, каждая полоса рисуется
     одним путём — двенадцать тысяч смен состояния canvas дороже отрисовки */
  grit=[];
  for(let g=0;g<GRIT_BANDS;g++) grit.push([]);
  for(let i=0;i<GRIT;i++){
    const d=galDir(SKY.inPlaneGrit,SKY.thickGrit), r=SKY.gritR;
    const b=.16+Math.pow(rnd(),1.6)*.62;
    grit[Math.min(GRIT_BANDS-1,Math.floor((b-.16)/.62*GRIT_BANDS))].push({x:d.x*r,y:d.y*r,z:d.z*r});
  }

  far=[];
  for(let i=0;i<FAR;i++){
    const d=galDir(SKY.inPlaneStar,SKY.thickStar), r=SKY.starR+rnd()*SKY.starVar;
    const mag=Math.pow(rnd(),2.4);
    // цвет достаётся только заметным звёздам, слабые остаются белёсыми
    let cls;
    if(mag<.30) cls=2;
    else { const q=rnd(); cls = q<.09?0 : q<.42?1 : q<.72?2 : q<.91?3 : 4; }
    far.push({
      x:d.x*r, y:d.y*r, z:d.z*r,
      b:.05+mag*.95,
      t:rnd()*6.2832, ts:.4+rnd()*1.7,
      sp:STAR_SPR[cls],
      big:mag>.988
    });
  }

  sun=null; planets=null;
  const solar=!!(rec&&rec.solar);
  if(rec&&rec.star){
    const t=rec.star;                   // класс уже определён при постройке базы
    // где звезда окажется в кадре, больше не выбирается наугад: она стоит в
    // начале системных координат, а мы — у планеты прилёта
    const fbm=makeNoise3(), P=SUN_SPREAD;
    sun={t:t, solar:solar, name:solar?SOLAR.star.name:null,
         px:0, py:0, pz:0, x:0, y:0, z:1, fbm:fbm,
         dist:P.distMin+rnd()*(P.distMax-P.distMin),        // как далеко стоит
         aspect:P.aspectMin+rnd()*(P.aspectMax-P.aspectMin), // вытянутость ореола
         haloRot:(rnd()-.5)*3.1416,                          // и его наклон
         hue:(rnd()*2-1)*P.hueShift};                        // сдвиг оттенка внутри класса
    planets=buildPlanets(sun,rec);        // тела строятся по записи, а не наугад
    placeArrival(sun,planets);            // ставит корабль и раздаёт векторы
    sun.tex=starTexture(sun); sun.halo=starHalo(sun);
  }
  sysLabel();
  if(typeof syncSysInfo==="function") syncSysInfo();       // сводка по системе и радар
  try{ history.replaceState(null,"","#"+seed); }catch(e){}
}

const near=[];

function seedNear(p,fresh){
  p.x=(Math.random()-.5)*SPREAD*2;
  p.y=(Math.random()-.5)*SPREAD*2;
  p.z=fresh?Math.pow(Math.random(),.72)*DEPTH+2:DEPTH;
  p.b=.30+Math.random()*.70;
  const r=Math.random(); p.w=r<.13?1:(r<.23?2:0);
  return p;
}
for(let i=0;i<NEAR;i++) near.push(seedNear({},true));

/* ================= состояние полёта ================= */
const K={l:0,r:0,u:0,d:0};
const S={yaw:0,pitch:0,vyaw:0,vpitch:0,roll:0,vroll:0,
         throttle:.35,speed:0,boost:0,boostKey:false,t:0};

/* прыжок: 1 — раскрутка привода, 2 — тоннель, 3 — выход в новую систему.
   Длительности фаз — в config.js */
const J={ph:0, t:0, flash:0, lastType:""};

/* цель выбирается в меню; сюда приходит уже принятое решение */
let jumpTarget=null;

function startJump(t){
  if(J.ph) return;
  jumpTarget=t;
  J.ph=1; J.t=0;
  wake();
}
function arrive(){
  const t=jumpTarget;
  let i = t&&t.home ? GALAXY.byId["SOL"] : (t&&t.i>=0 ? t.i : 0);
  if(i===undefined) i=0;
  GALAXY.at=i;
  GALAXY.systems[i].visited=true;        // отметка на карте: здесь мы были
  buildWorld(GALAXY.systems[i].seed);
  jumpTarget=null;
  S.yaw=0; S.pitch=0; S.vyaw=0; S.vpitch=0; S.roll=0; S.vroll=0;
}

/* ==== engine/ship.js ==== */
/* ================= состояние корабля =================
   Двадцать показателей. Половина считается из того, что происходит на самом
   деле: реактор идёт за тягой, обшивка греется у светила, радиация растёт с
   его светимостью и падает с расстоянием, задержка связи — это буквально
   расстояние до Солнца, делённое на скорость света. Остальное — расходуемое:
   топливо, ресурс, заряд привода.

   Показатели, которые ни на что не отвечают, здесь не нужны: приборная
   доска, которая врёт, хуже пустой стены. */

/* имя SHIP занято положением корабля в системе — здесь состояние */
const STATUS={
  fuel:100, hull:100, shield:100, wear:0,
  coreT:2400, driveT:310, skinT:250,
  o2:99.4, co2:410, drift:0, t:0
};

function shipUpdate(dt,load,boost,jumpK){
  STATUS.t+=dt;
  const heat=load*(1+boost*2.2)+jumpK*2.4;

  // топливо: на дрейфе почти не тратится, форсаж и прыжок жгут всерьёз
  STATUS.fuel=Math.max(0, STATUS.fuel - dt*(load*.030 + boost*.22 + jumpK*.9));
  if(STATUS.fuel<0.5) STATUS.fuel=100;                       // дозаправка у планеты

  // температуры: активная зона, двигатель, обшивка
  const coreTarget=2200+heat*1500;
  STATUS.coreT+=(coreTarget-STATUS.coreT)*Math.min(1,dt*.5);
  const driveTarget=290+heat*520;
  STATUS.driveT+=(driveTarget-STATUS.driveT)*Math.min(1,dt*.35);

  // обшивка греется от светила: закон обратных квадратов, как ему и положено
  let star=0;
  if(sun){
    const dAU=Math.max(.02,Math.hypot(sun.x,sun.y,sun.z));
    star=sun.t.lum/(dAU*dAU);
  }
  const skinTarget=60+Math.min(600,star*180)+heat*90;
  STATUS.skinT+=(skinTarget-STATUS.skinT)*Math.min(1,dt*.25);
  STATUS.star=star;

  // ресурс и снос счисления копятся, воздух дышится
  STATUS.wear=Math.min(100, STATUS.wear + dt*(load*.004+boost*.03+jumpK*.05));
  STATUS.drift+=dt*(12+load*40);
  STATUS.o2=98.6+Math.sin(STATUS.t*.11)*.7;
  STATUS.co2=402+Math.sin(STATUS.t*.07)*14+load*6;
  STATUS.shield=Math.min(100, STATUS.shield + dt*(2.2-load*1.2));
}

function fmt1(v){ return TN(Math.round(v*10)/10); }

/* расстояние до дома в световых годах — из него же выводится задержка связи */
function lyHome(){
  const home=systemById("SOL");
  if(!home) return null;
  return systemDist(systemAt(),home);
}

/* двадцать строк для нижней панели: подпись, значение, доля для полоски */
function shipReadout(){
  const load=Math.min(1,S.speed/MAXV), boost=S.boost;
  const jumpCharge=J.ph===1 ? J.t/J_CHARGE : J.ph>1 ? 1 : 0;
  const home=lyHome();
  const dStar=sun?Math.hypot(sun.x,sun.y,sun.z):null;
