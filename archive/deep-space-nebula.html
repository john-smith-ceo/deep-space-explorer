<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Полёт сквозь космос</title>
<meta name="description" content="Полноэкранная заставка: полёт сквозь глубокий космос с частицами пыли на фоне бесшовной панорамы туманности 3636×2048. Управление тягой и курсом, без установки и зависимостей.">
<meta property="og:title" content="Полёт сквозь космос">
<meta property="og:description" content="Космическая пыль, туманности, дрейф среди звёзд. Один HTML-файл.">
<meta property="og:type" content="website">
<style>
:root{--amber:#ff9d2f;--amber-d:#a35c12;--ice:#9fd4ff}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#000;overflow:hidden}
body{font-family:"JetBrains Mono","SF Mono",ui-monospace,Menlo,Consolas,monospace;color:var(--amber);cursor:default}
body.hidecursor{cursor:none}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%}

.hud{position:fixed;inset:0;pointer-events:none;z-index:10;transition:opacity .6s}
.hud.off{opacity:0}

/* тяга */
.throttle{position:absolute;left:36px;top:50%;transform:translateY(-50%);width:56px}
.tbar{position:relative;height:210px;border:1px solid rgba(255,157,47,.35);background:rgba(255,157,47,.04)}
.tfill{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(180deg,rgba(255,157,47,.85),rgba(255,157,47,.25));box-shadow:0 0 18px rgba(255,157,47,.5);transition:height .12s linear}
.tbar i{position:absolute;left:-6px;right:-6px;height:1px;background:rgba(255,157,47,.28)}
.tlabel{margin-top:10px;font-size:10px;letter-spacing:.18em;text-align:center;opacity:.75}
.tval{margin-top:3px;font-size:15px;text-align:center;text-shadow:0 0 12px rgba(255,157,47,.7)}

/* скорость */
.speed{position:absolute;right:38px;top:50%;transform:translateY(-50%);text-align:right}
.speed .n{font-size:38px;line-height:1;letter-spacing:.02em;text-shadow:0 0 20px rgba(255,157,47,.55)}
.speed .u{font-size:11px;letter-spacing:.24em;opacity:.7;margin-top:6px}
.fsd{margin-top:16px;font-size:10px;letter-spacing:.2em;color:var(--ice);opacity:0;transition:opacity .25s;text-shadow:0 0 14px rgba(159,212,255,.8)}
.fsd.on{opacity:1;animation:fsdpulse 1.1s ease-in-out infinite}
@keyframes fsdpulse{0%,100%{opacity:1}50%{opacity:.45}}

/* рамка-прицел */
.retic{position:absolute;left:50%;top:50%;width:104px;height:104px;transform:translate(-50%,-50%);opacity:.5}
.retic span{position:absolute;width:15px;height:15px;border:1px solid rgba(255,157,47,.65)}
.retic span:nth-child(1){left:0;top:0;border-right:0;border-bottom:0}
.retic span:nth-child(2){right:0;top:0;border-left:0;border-bottom:0}
.retic span:nth-child(3){left:0;bottom:0;border-right:0;border-top:0}
.retic span:nth-child(4){right:0;bottom:0;border-left:0;border-top:0}
.retic b{position:absolute;left:50%;top:50%;width:3px;height:3px;margin:-1.5px;background:var(--amber);box-shadow:0 0 10px var(--amber)}

/* верхняя строка */
.top{position:absolute;left:0;right:0;top:26px;text-align:center;font-size:10px;letter-spacing:.28em;opacity:.55}

/* подсказка */
.help{position:absolute;left:0;right:0;bottom:30px;text-align:center;font-size:11px;letter-spacing:.14em;color:rgba(255,157,47,.62);transition:opacity .8s}
.help.off{opacity:0}
.help kbd{border:1px solid rgba(255,157,47,.4);padding:2px 7px;margin:0 3px;border-radius:2px;font:inherit;color:var(--amber);background:rgba(255,157,47,.07)}

/* заставка старта */
.boot{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:#000;transition:opacity .9s}
.boot.gone{opacity:0;pointer-events:none}
.boot h1{font-size:clamp(22px,4.4vw,40px);font-weight:400;letter-spacing:.34em;text-transform:uppercase;text-shadow:0 0 26px rgba(255,157,47,.6)}
.boot p{font-size:11px;letter-spacing:.2em;color:rgba(255,157,47,.6);text-align:center;line-height:2.1}
.boot button{margin-top:6px;pointer-events:auto;cursor:pointer;background:rgba(255,157,47,.08);border:1px solid rgba(255,157,47,.5);color:var(--amber);font:inherit;font-size:12px;letter-spacing:.22em;padding:13px 34px;text-transform:uppercase;transition:.2s}
.boot button:hover{background:rgba(255,157,47,.2);box-shadow:0 0 26px rgba(255,157,47,.35)}
@media (max-width:700px){.throttle{left:14px;transform:translateY(-50%) scale(.8)}.speed{right:16px}.speed .n{font-size:28px}}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="hud" id="hud">
  <div class="top">DEEP SPACE · DRIFT MODE</div>
  <div class="throttle">
    <div class="tbar"><div class="tfill" id="tfill" style="height:45%"></div>
      <i style="bottom:25%"></i><i style="bottom:50%"></i><i style="bottom:75%"></i>
    </div>
    <div class="tlabel">THROTTLE</div>
    <div class="tval" id="tval">45%</div>
  </div>
  <div class="speed"><div class="n" id="spd">0</div><div class="u">M/S</div>
    <div class="fsd" id="fsd">FRAME SHIFT DRIVE</div>
  </div>
  <div class="retic"><span></span><span></span><span></span><span></span><b></b></div>
  <div class="help" id="help">
    <kbd>← ↑ ↓ →</kbd> курс <kbd>колесо</kbd> / <kbd>W</kbd><kbd>S</kbd> тяга
    <kbd>Space</kbd> форсаж <kbd>X</kbd> стоп <kbd>F</kbd> полный экран <kbd>H</kbd> интерфейс
  </div>
</div>

<div class="boot" id="boot">
  <h1>Deep Space</h1>
  <p>полёт сквозь пыль и звёзды<br>стрелки ведут курс · колесо задаёт тягу · пробел форсирует</p>
  <button id="go">Запустить полёт</button>
</div>

<script>
(function(){
"use strict";
const cv=document.getElementById("c"), ctx=cv.getContext("2d",{alpha:false});
let W=0,H=0,cx=0,cy=0,dpr=1,F=900;

/* ================= фон: панорама 2K, бесшовная по горизонтали ================= */
let sky=null, skyReady=false, SKY_W=3636, SKY_H=2048;
(function(){
  const im=new Image();
  im.onload=function(){ sky=im; SKY_W=im.naturalWidth; SKY_H=im.naturalHeight; skyReady=true; };
  im.src=SKY_DATA;
})();

/* ================= частицы ================= */
const NEAR=880, FAR=1050;
const near=[], far=[];
const DEPTH=170, SPREAD=200;

function seedNear(p,fresh){
  p.x=(Math.random()-.5)*SPREAD*2;
  p.y=(Math.random()-.5)*SPREAD*2;
  p.z=fresh?Math.pow(Math.random(),.72)*DEPTH+2:DEPTH;
  p.b=.30+Math.random()*.70;
  const r=Math.random(); p.w=r<.13?1:(r<.23?2:0);   // тёплая / холодная / нейтральная
  return p;
}
for(let i=0;i<NEAR;i++) near.push(seedNear({},true));

for(let i=0;i<FAR;i++){
  // равномерно по сфере
  const u=Math.random()*2-1, th=Math.random()*6.2832, r=760+Math.random()*260;
  const s=Math.sqrt(1-u*u);
  far.push({
    x:r*s*Math.cos(th), y:r*u, z:r*s*Math.sin(th),
    b:Math.pow(Math.random(),2.1)*.95+.05,
    t:Math.random()*6.2832, ts:.4+Math.random()*1.7,
    c:Math.random()<.16?(Math.random()<.5?"warm":"cool"):"white",
    big:Math.random()<.014
  });
}

/* ================= состояние полёта ================= */
const K={l:0,r:0,u:0,d:0};          // стрелки: состояние клавиш
const S={yaw:0,pitch:0,vyaw:0,vpitch:0,roll:0,vroll:0,
         throttle:.35,speed:0,boost:0,boostKey:false,mx:0,my:0,t:0};
const MAXV=265;      // юнитов в секунду при полной тяге

/* ================= рендер ================= */
function resize(){
  dpr=Math.min(window.devicePixelRatio||1,2);
  W=cv.clientWidth; H=cv.clientHeight;
  cv.width=W*dpr; cv.height=H*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  cx=W/2; cy=H/2; F=Math.max(W,H)*.78;
}
window.addEventListener("resize",resize);

function rotate(p,dy,dp){
  // вокруг Y (рыскание)
  const cy1=Math.cos(dy), sy1=Math.sin(dy);
  let x=p.x*cy1 - p.z*sy1, z=p.x*sy1 + p.z*cy1;
  // вокруг X (тангаж)
  const cp=Math.cos(dp), sp=Math.sin(dp);
  let y=p.y*cp - z*sp; z=p.y*sp + z*cp;
  p.x=x; p.y=y; p.z=z;
}

let last=performance.now();
function frame(now){
  let dt=(now-last)/1000; last=now;
  if(dt>.05) dt=.05;
  S.t+=dt;

  /* --- управление --- */
  const tgtYaw=(K.l-K.r)*0.62, tgtPitch=(K.d-K.u)*0.48;
  S.vyaw += (tgtYaw-S.vyaw)*Math.min(1,dt*2.2);
  S.vpitch += (tgtPitch-S.vpitch)*Math.min(1,dt*2.2);
  const dyaw=S.vyaw*dt, dpitch=S.vpitch*dt;
  S.yaw+=dyaw; S.pitch+=dpitch;
  S.vroll += ((-S.vyaw*.30)-S.vroll)*Math.min(1,dt*1.6);
  S.roll=S.vroll;

  const bt=S.boostKey?1:0;
  S.boost += (bt-S.boost)*Math.min(1,dt*(bt?1.1:.6));
  const target=S.throttle*MAXV*(1+S.boost*3.4);
  S.speed += (target-S.speed)*Math.min(1,dt*1.35);
  const travel=S.speed*dt;
  const STREAK=2.6;   // штрих длиннее реального смещения — так читается скорость

  /* --- фон --- */
  ctx.fillStyle="#000205"; ctx.fillRect(0,0,W,H);
  if(skyReady){
    const scale=Math.max(H*1.06/SKY_H, .34);   // не крупнее натурального — иначе мыло на Retina
    const sw=SKY_W*scale, sh=SKY_H*scale;
    let ox=(-S.yaw/6.2832)*sw % sw; if(ox>0) ox-=sw;
    let oy=cy-sh/2 + (S.pitch/1.6)*sh*.5;
    oy=Math.max(Math.min(oy,0),H-sh);
    ctx.save();
    ctx.translate(cx,cy); ctx.rotate(S.roll*.5); ctx.translate(-cx,-cy);
    ctx.globalAlpha=1;
    for(let k=0;k<=Math.ceil(W/sw)+1;k++) ctx.drawImage(sky,ox+k*sw,oy,sw,sh);
    ctx.restore();
    ctx.fillStyle="rgba(0,2,7,.17)"; ctx.fillRect(0,0,W,H);   // лёгкая глубина, без затемнения
  }

  ctx.save();
  ctx.translate(cx,cy); ctx.rotate(S.roll); ctx.translate(-cx,-cy);

  /* --- дальние звёзды --- */
  ctx.globalCompositeOperation="lighter";
  for(let i=0;i<FAR;i++){
    const p=far[i];
    rotate(p,-dyaw,-dpitch);
    if(p.z<=1) continue;
    const k=F/p.z, sx=cx+p.x*k, sy=cy+p.y*k;
    if(sx<-40||sx>W+40||sy<-40||sy>H+40) continue;
    const tw=.72+.28*Math.sin(S.t*p.ts+p.t);
    const a=p.b*tw;
    if(a<.035) continue;
    let col = p.c==="warm" ? "255,205,155" : p.c==="cool" ? "170,205,255" : "225,235,255";
    if(p.big){
      const r=2.6+p.b*3.4;
      const gr=ctx.createRadialGradient(sx,sy,0,sx,sy,r*4.5);
      gr.addColorStop(0,"rgba("+col+","+(a*.95).toFixed(3)+")");
      gr.addColorStop(.28,"rgba("+col+","+(a*.28).toFixed(3)+")");
      gr.addColorStop(1,"rgba("+col+",0)");
      ctx.fillStyle=gr; ctx.beginPath(); ctx.arc(sx,sy,r*4.5,0,6.2832); ctx.fill();
      // дифракционные лучи
      ctx.strokeStyle="rgba("+col+","+(a*.20).toFixed(3)+")"; ctx.lineWidth=.55;
      ctx.beginPath();
      ctx.moveTo(sx-r*4.2,sy); ctx.lineTo(sx+r*4.2,sy);
      ctx.moveTo(sx,sy-r*4.2); ctx.lineTo(sx,sy+r*4.2);
      ctx.stroke();
    }else{
      ctx.fillStyle="rgba("+col+","+a.toFixed(3)+")";
      ctx.beginPath(); ctx.arc(sx,sy,p.b>.62?1.0:.62,0,6.2832); ctx.fill();
    }
  }

  /* --- ближняя пыль: стрики --- */
  const fast=Math.min(1,S.speed/MAXV);
  for(let i=0;i<NEAR;i++){
    const p=near[i];
    rotate(p,-dyaw,-dpitch);
    p.z-=travel;
    if(p.z<1.2){ seedNear(p,false); continue; }
    if(p.z>DEPTH+40){ seedNear(p,false); continue; }
    const k=F/p.z;
    const sx=cx+p.x*k, sy=cy+p.y*k;
    if(sx<-160||sx>W+160||sy<-160||sy>H+160){
      if(p.z<DEPTH*.35) seedNear(p,false);
      continue;
    }
    const z0=p.z+travel*STREAK*(1+S.boost*.5), k0=F/z0;
    const px=cx+p.x*k0, py=cy+p.y*k0;
    // видимость: гаснет вдали и у самого носа
    let a=p.b*Math.min(1,(DEPTH-p.z)/(DEPTH*.42))*Math.min(1,p.z/7);
    a*=.46+fast*.54;
    if(a<=.01) continue;
    const col=p.w===1?"255,212,164":p.w===2?"158,198,255":"228,240,255";
    const len=Math.hypot(sx-px,sy-py);
    if(len>1.4){                                   // хвост — тонкий и тусклый
      ctx.strokeStyle="rgba("+col+","+(a*.40).toFixed(3)+")";
      ctx.lineWidth=Math.min(1.45,.34+k*.026);
      ctx.lineCap="round";
      ctx.beginPath(); ctx.moveTo(px,py); ctx.lineTo(sx,sy); ctx.stroke();
    }
    ctx.fillStyle="rgba("+col+","+a.toFixed(3)+")";  // голова — яркая точка
    ctx.beginPath(); ctx.arc(sx,sy,Math.min(1.6,.40+k*.028),0,6.2832); ctx.fill();
  }
  ctx.globalCompositeOperation="source-over";
  ctx.restore();

  /* --- пост: тоннель скорости и виньетка --- */
  if(fast>.04){
    const gr=ctx.createRadialGradient(cx,cy,Math.min(W,H)*.16,cx,cy,Math.max(W,H)*.75);
    gr.addColorStop(0,"rgba(120,180,255,0)");
    gr.addColorStop(.62,"rgba(90,150,255,"+(fast*.05).toFixed(3)+")");
    gr.addColorStop(1,"rgba(150,190,255,"+(fast*.13*(1+S.boost)).toFixed(3)+")");
    ctx.globalCompositeOperation="lighter";
    ctx.fillStyle=gr; ctx.fillRect(0,0,W,H);
    ctx.globalCompositeOperation="source-over";
  }
  const vg=ctx.createRadialGradient(cx,cy,Math.min(W,H)*.28,cx,cy,Math.max(W,H)*.78);
  vg.addColorStop(0,"rgba(0,0,0,0)"); vg.addColorStop(1,"rgba(0,0,2,.72)");
  ctx.fillStyle=vg; ctx.fillRect(0,0,W,H);

  /* --- HUD --- */
  spdEl.textContent=Math.round(S.speed*38).toLocaleString("ru-RU");
  fsdEl.classList.toggle("on",S.boost>.25);

  requestAnimationFrame(frame);
}

/* ================= ввод ================= */
const spdEl=document.getElementById("spd"), fsdEl=document.getElementById("fsd"),
      tfill=document.getElementById("tfill"), tval=document.getElementById("tval"),
      hud=document.getElementById("hud"), help=document.getElementById("help"),
      boot=document.getElementById("boot");

function setThrottle(v){
  S.throttle=Math.max(0,Math.min(1,v));
  tfill.style.height=(S.throttle*100)+"%";
  tval.textContent=Math.round(S.throttle*100)+"%";
}
window.addEventListener("pointermove",()=>wake(),{passive:true});   // мышь курс не ведёт — только будит интерфейс
window.addEventListener("wheel",e=>{
  setThrottle(S.throttle-Math.sign(e.deltaY)*.05); wake();
},{passive:true});
window.addEventListener("keydown",e=>{
  const k=e.key.toLowerCase();
  if(e.key==="ArrowLeft"){K.l=1;e.preventDefault()}
  else if(e.key==="ArrowRight"){K.r=1;e.preventDefault()}
  else if(e.key==="ArrowUp"){K.u=1;e.preventDefault()}
  else if(e.key==="ArrowDown"){K.d=1;e.preventDefault()}
  else if(k==="w"||k==="ц"){setThrottle(S.throttle+.06);e.preventDefault()}
  else if(k==="s"||k==="ы"){setThrottle(S.throttle-.06);e.preventDefault()}
  else if(e.code==="Space"){S.boostKey=true;e.preventDefault()}
  else if(k==="f"||k==="а"){toggleFS()}
  else if(k==="h"||k==="р"){hud.classList.toggle("off")}
  else if(k==="x"||k==="ч"){setThrottle(0)}
  wake();
});
window.addEventListener("keyup",e=>{
  if(e.code==="Space") S.boostKey=false;
  else if(e.key==="ArrowLeft") K.l=0;
  else if(e.key==="ArrowRight") K.r=0;
  else if(e.key==="ArrowUp") K.u=0;
  else if(e.key==="ArrowDown") K.d=0;
});
window.addEventListener("blur",()=>{K.l=K.r=K.u=K.d=0;S.boostKey=false;});

function toggleFS(){
  if(!document.fullscreenElement) (document.documentElement.requestFullscreen||function(){}).call(document.documentElement);
  else document.exitFullscreen();
}
document.addEventListener("dblclick",toggleFS);

/* прятать курсор и подсказку в покое */
let idle=null;
function wake(){
  document.body.classList.remove("hidecursor");
  help.classList.remove("off");
  clearTimeout(idle);
  idle=setTimeout(()=>{
    document.body.classList.add("hidecursor");
    help.classList.add("off");
  },4000);
}

/* пауза во вкладке в фоне */
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) last=performance.now(); });

/* старт */
document.getElementById("go").addEventListener("click",()=>{
  boot.classList.add("gone");
  setTimeout(()=>boot.remove(),1000);
  toggleFS();
  wake();
});

resize();
setThrottle(.45);
requestAnimationFrame(t=>{last=t;requestAnimationFrame(frame)});
})();
</script>
</body>
</html>
